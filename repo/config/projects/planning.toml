[project]
title = "Planning"
description = "Proposals and milestones before implementation begins."
public = false
readme = """
# Planning

Collect proposals, assess their scope, and track planned delivery dates.
Implementation work belongs on the Development project.
"""

[[fields]]
name = "Status"
data_type = "SINGLE_SELECT"
options = [
  { name = "Proposed", color = "GRAY", description = "An idea awaiting assessment." },
  { name = "Assessing", color = "YELLOW", description = "Scope and feasibility are being evaluated." },
  { name = "Planned", color = "BLUE", description = "Accepted for future implementation." },
  { name = "Delivered", color = "GREEN", description = "Implementation has been delivered." },
]

[[fields]]
name = "Target date"
data_type = "DATE"

[[views]]
name = "Proposals"
layout = "TABLE_LAYOUT"
visible_fields = ["Title", "Status", "Target date"]

[[views]]
name = "Progress"
layout = "BOARD_LAYOUT"
visible_fields = ["Title", "Status", "Target date"]

[[views]]
name = "Roadmap"
layout = "ROADMAP_LAYOUT"
visible_fields = ["Title", "Status", "Target date"]

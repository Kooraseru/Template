# Keep the administrative update restriction separate from the CI gate.
[ruleset]
name = "Only administrators merge source"
target = "branch"
enforcement = "active"
include = ["refs/heads/source"]
exclude = []

[[bypass_actors]]
actor_id = 5
actor_type = "RepositoryRole"
# The separate source-gate ruleset still requires PRs and passing CI.
bypass_mode = "always"

[[rules]]
type = "update"

[[hooks.SessionStart]]
matcher = "^(startup|resume|clear|fork)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "node .codex/hooks/checkEditorProblems.js"
timeout = 7
statusMessage = "Reading VS Code Problems"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Write|Edit|Bash)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node .codex/hooks/checkEditorProblems.js"
timeout = 7

[[hooks.PostToolUse]]
matcher = "^(apply_patch|Write|Edit|Bash)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "node .codex/hooks/checkEditorProblems.js"
timeout = 7

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "node .codex/hooks/ruleAudit.js"
timeout = 5
additionalContextLimit = 4000

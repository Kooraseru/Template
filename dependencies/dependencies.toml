# Local packages
[luau.ruleLinter]
path = "packages/ruleLinter"

[tools.dependencyLoader]
path = "packages/dependencyLoader"

[tools.dataFormats]
path = "packages/dataFormats"

[tools.preflightChecker]
path = "packages/preflightChecker"

[tools.editorIntegration]
path = "packages/editorIntegration"

[tools.workbenchBridgeClient]
path = "packages/workbenchBridgeClient"

# Locked upstream dependencies. Output paths are relative to build/dependencies.
[luau.lute]
source = "github.com/luau-lang/lute"
version = "v1.0.1-nightly.20261104"
path = "packages/lute"
binaryPath = "binaries/lute"
typesPath = "types/lute"
setup = ["setup", "--with-luaurc"]

[luau.lute.assets]
"win32-x64" = "lute-windows-x86_64.zip"
"win32-arm64" = "lute-windows-x86_64.zip"
"linux-x64" = "lute-linux-x86_64.zip"
"linux-arm64" = "lute-linux-aarch64.zip"
"darwin-arm64" = "lute-macos-aarch64.zip"

[luau.lute.executables]
"win32-x64" = "lute.exe"
"win32-arm64" = "lute.exe"
"linux-x64" = "lute"
"linux-arm64" = "lute"
"darwin-arm64" = "lute"

[luau.lute.setupAliases]
lute = "."
std = "std"

[tools.pandoc]
source = "github.com/jgm/pandoc"
version = "3.13"
path = "packages/pandoc"
binaryPath = "binaries/pandoc"

[tools.pandoc.assets]
"win32-x64" = "pandoc-*-windows-x86_64.zip"
"win32-arm64" = "pandoc-*-windows-x86_64.zip"
"linux-x64" = "pandoc-*-linux-amd64.tar.gz"
"linux-arm64" = "pandoc-*-linux-arm64.tar.gz"
"darwin-x64" = "pandoc-*-x86_64-macOS.zip"
"darwin-arm64" = "pandoc-*-arm64-macOS.zip"

[tools.pandoc.executables]
"win32-x64" = "pandoc.exe"
"win32-arm64" = "pandoc.exe"
"linux-x64" = "pandoc"
"linux-arm64" = "pandoc"
"darwin-x64" = "pandoc"
"darwin-arm64" = "pandoc"

[tools.actionsLock]
source = "github.com/github/gh-actions-lock"
version = "v0.4.1"
path = "packages/actionsLock"
binaryPath = "binaries/actionsLock"

[tools.actionsLock.assets]
"win32-x64" = "windows-amd64.exe"
"win32-arm64" = "windows-arm64.exe"
"linux-x64" = "linux-amd64"
"linux-arm64" = "linux-arm64"
"darwin-x64" = "darwin-amd64"
"darwin-arm64" = "darwin-arm64"

[tools.actionsLock.executables]
"win32-x64" = "actions-lock.exe"
"win32-arm64" = "actions-lock.exe"
"linux-x64" = "actions-lock"
"linux-arm64" = "actions-lock"
"darwin-x64" = "actions-lock"
"darwin-arm64" = "actions-lock"

[tools.yaml]
source = "npm"
package = "yaml"
version = "2.8.1"
path = "packages/yaml"

[tools.nodeTypes]
source = "npm"
package = "@types/node"
version = "24.10.1"
path = "types/node"

[tools.typescript]
source = "npm"
package = "typescript"
version = "5.9.3"
path = "packages/typescript"

name: Feature request
description: Propose an improvement and explain the problem it solves.
title: "[Feature] "
labels: [enhancement, needs triage]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the intended result, with an example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context

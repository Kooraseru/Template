name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
labels: [bug, needs triage]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem and what it prevents you from doing.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example, commands, or configuration that reproduces it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version, commit SHA, or branch tested
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Operating system, runtime, compiler, dependencies, or hosting environment as applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Include relevant output or screenshots if available.

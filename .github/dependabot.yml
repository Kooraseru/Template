version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ci-packages:
        patterns:
          - "Kooraseru-Hub/CI-Packages*"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "Kooraseru-Hub/CI-Packages*"

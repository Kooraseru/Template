version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, python]
    groups:
      docs-toolchain:
        patterns: ["*"]

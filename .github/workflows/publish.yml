name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Generated branch to replace.
        required: true
        type: choice
        options: [pre-release, release]
      version:
        description: Version without a leading v.
        required: true
        type: string
      replace_existing_release:
        description: Explicitly replace an existing tag and GitHub Release.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require source workflow ref
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "source" ]; then
            echo "Publish must be dispatched from source, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Require protected release configuration
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
          SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
        run: |
          for name in TOKEN SIGNING_KEY SIGNING_NAME SIGNING_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing protected release value: $name" >&2
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: |
          git fetch origin source:refs/remotes/origin/source --no-tags
          source_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$source_commit" origin/source; then
            echo "Checked out commit is not part of origin/source: $source_commit" >&2
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Validate version
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v* ]]; then
            echo "Version must not include the leading v: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Version contains unsupported characters: $VERSION" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/automation-requirements.txt
      - name: Install automation dependencies
        run: python -m pip install --requirement .github/automation-requirements.txt
      - name: Validate publication tooling
        run: |
          bash -n .github/scripts/publish-generated-branch.sh
          python .github/scripts/validate-repository.py
          python .github/scripts/test-localization.py
          python .github/scripts/test-publication.py
          python .github/scripts/test-publication-manifests.py

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
          RELEASE_SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
          RELEASE_SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
        run: |
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "Imported release key has no secret-key fingerprint" >&2
            exit 1
          fi
          wrapper="$RUNNER_TEMP/gpg-wrapper"
          # shellcheck disable=SC2016 # Preserve variables for the generated wrapper.
          printf '%s\n' '#!/usr/bin/env bash' 'exec gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_SIGNING_PASSPHRASE" "$@"' > "$wrapper"
          chmod 700 "$wrapper"
          git config --global user.name "$RELEASE_SIGNING_NAME"
          git config --global user.email "$RELEASE_SIGNING_EMAIL"
          git config --global user.signingkey "$fingerprint"
          git config --global gpg.program "$wrapper"
          git config --global commit.gpgsign true
          git config --global tag.gpgSign true

      - name: Build publication payload
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python .github/scripts/build-publication.py \
            --source . \
            --destination ".generated/repo/$CHANNEL" \
            --config .github/publication/config.yml \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT"

      - name: Publish generated branch
        id: generated
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          remote_url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/publish-generated-branch.sh \
            ".generated/repo/$CHANNEL" "$remote_url" "$CHANNEL" "$VERSION" \
            "$SOURCE_COMMIT" "$GITHUB_OUTPUT"

      - name: Create signed tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          GENERATED_COMMIT: ${{ steps.generated.outputs.generated_commit }}
          REPLACE: ${{ inputs.replace_existing_release }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          remote_url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          release_exists=false
          tag_exists=false
          gh release view "$TAG" >/dev/null 2>&1 && release_exists=true
          git ls-remote --exit-code --tags "$remote_url" "refs/tags/$TAG" >/dev/null 2>&1 && tag_exists=true
          if { [ "$release_exists" = true ] || [ "$tag_exists" = true ]; } && [ "$REPLACE" != true ]; then
            echo "$TAG already exists; rerun with explicit replacement enabled" >&2
            exit 1
          fi
          [ "$release_exists" = false ] || gh release delete "$TAG" --yes
          [ "$tag_exists" = false ] || git push --quiet "$remote_url" ":refs/tags/$TAG"
          git fetch "$remote_url" "refs/heads/$CHANNEL" --depth=1
          git cat-file -e "$GENERATED_COMMIT^{commit}"
          git verify-commit "$GENERATED_COMMIT"
          git tag -s -m "$TAG" "$TAG" "$GENERATED_COMMIT"
          git verify-tag "$TAG"
          git push --quiet "$remote_url" "refs/tags/$TAG:refs/tags/$TAG"
          tar -czf "$RUNNER_TEMP/$TAG.tar.gz" -C ".generated/repo/$CHANNEL" .
          release_args=(--verify-tag --generate-notes)
          if [ "$CHANNEL" = pre-release ]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--prerelease=false --latest)
          fi
          gh release create "$TAG" "$RUNNER_TEMP/$TAG.tar.gz" "${release_args[@]}"


  refresh-pages:
    name: Refresh Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch source-owned Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref source

name: Publish
on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target (rehearse makes no external changes)
        type: choice
        options: [rehearse, releases, branches, pages]
        default: rehearse
  pull_request:
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  releases:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.target == 'releases'
    runs-on: ubuntu-latest
    environment: ci-publication
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: releases
          path: build/github/releases
      - uses: Kooraseru-Hub/CI-Packages/packages/releases/publish@95b47994768f570518270bf9d93fb42f252dc302
        with:
          index: build/github/releases/index.json
          repository: ${{ github.repository }}
          confirm: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
  branches:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.target == 'branches'
    runs-on: ubuntu-latest
    environment: ci-publication
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: generated-branches
          path: build/github/branches
      - uses: Kooraseru-Hub/CI-Packages/packages/repository/branches@95b47994768f570518270bf9d93fb42f252dc302
        with:
          directory: build/github/branches
          repository: ${{ github.repository }}
          default-branch: ${{ github.event.repository.default_branch }}
          confirm: 'true'
        env:
          GH_TOKEN: ${{ github.token }}
  pages-artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: documentation
          path: build/github/pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/github/pages
  pages:
    needs: pages-artifact
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.target == 'pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deploy

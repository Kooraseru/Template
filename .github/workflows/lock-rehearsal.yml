name: Verify controller lock
# Temporary read-only migration verification; remove before merging.
on:
  push:
    branches: [maintenance/direct-environment-delivery]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/lock-rehearsal.yml
      - name: Regenerate official Actions lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock
          git diff --stat
          echo '--- BEGIN GENERATED LOCK ---'
          cat .github/workflows/actions.lock
          echo '--- END GENERATED LOCK ---'
          git diff --exit-code -- .github/workflows/bootstrap.yml

name: Action lock recovery proof
on:
  push:
    branches: [fix/action-lock-provenance]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact recovery candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify actual runner resolution of existing immutable engine
        uses: Kooraseru-Hub/CI-Engine@d9ddb3a39097fd5c7789ebe101bb3363f73fa7a2
        with:
          phase: prepare
          operation: validation
          publish: false
      - name: Validate lockfile with official CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify-local
          gh actions-lock --verify --no-narrow

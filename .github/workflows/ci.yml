name: CI

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after successful validation
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Project Components
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
      CI_OPERATION: ${{ github.event_name == 'pull_request' && 'validation' || 'build' }}
      CI_GRAPH_RUN: "true"
      CI_PHASE: build
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Execute Build Components
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --stage build
      - name: Export Verified Build Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-bundles
          path: build/run/${{ env.CI_RUN_ID }}/transport/bundles/
          if-no-files-found: error
          retention-days: 3

  tests:
    name: Execute Test Suites
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Execute Repository Tests
        run: bash ci/test.sh

  validate:
    name: validate
    if: always()
    needs: [build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Successful Build and Tests
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success

  publish-general:
    name: Publish Project Artifacts
    if: ${{ github.ref == 'refs/heads/source' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      CI_EVENT: push
      CI_OPERATION: build
      CI_GRAPH_RUN: "true"
      CI_PHASE: publish
      CI_PROFILE: source-ci
      CI_PUBLISH_GROUP: general
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Receive Verified Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-build-bundles
          path: build/run/${{ env.CI_RUN_ID }}/transport/bundles/
      - name: Execute Publication Components
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --stage publish
      - name: Export Publication Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-publish-general
          path: build/run/${{ env.CI_RUN_ID }}/publish/general/
          if-no-files-found: ignore
          retention-days: 3

  publish-projects:
    name: Publish Project Configuration
    if: ${{ github.ref == 'refs/heads/source' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: ci-projects
      deployment: false
    env:
      CI_EVENT: push
      CI_OPERATION: build
      CI_GRAPH_RUN: "true"
      CI_PHASE: publish
      CI_PROFILE: source-ci
      CI_PUBLISH_GROUP: ci-projects
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Receive Verified Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-build-bundles
          path: build/run/${{ env.CI_RUN_ID }}/transport/bundles/
      - name: Execute Project Components
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_ENVIRONMENT: ci-projects
          CI_CREDENTIAL_PROJECTS_TOKEN: ${{ secrets.CI_TOKEN }}
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --stage publish
      - name: Export Publication Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-publish-projects
          path: build/run/${{ env.CI_RUN_ID }}/publish/ci-projects/
          if-no-files-found: ignore
          retention-days: 3

  publish-rulesets:
    name: Publish Repository Rulesets
    if: ${{ github.ref == 'refs/heads/source' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: ci-rulesets
      deployment: false
    env:
      CI_EVENT: push
      CI_OPERATION: build
      CI_GRAPH_RUN: "true"
      CI_PHASE: publish
      CI_PROFILE: source-ci
      CI_PUBLISH_GROUP: ci-rulesets
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Receive Verified Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-build-bundles
          path: build/run/${{ env.CI_RUN_ID }}/transport/bundles/
      - name: Execute Ruleset Components
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_ENVIRONMENT: ci-rulesets
          CI_CREDENTIAL_APP_ID: ${{ vars.CI_APP_ID }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --stage publish
      - name: Export Publication Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-publish-rulesets
          path: build/run/${{ env.CI_RUN_ID }}/publish/ci-rulesets/
          if-no-files-found: ignore
          retention-days: 3

  publication-result:
    name: Verify Publication Results
    if: ${{ always() && github.ref == 'refs/heads/source' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: [validate, publish-general, publish-projects, publish-rulesets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      actions: read
      id-token: write
    environment:
      name: ci-reporting
      deployment: false
    env:
      CI_EVENT: push
      CI_OPERATION: build
      CI_GRAPH_RUN: "true"
      CI_PHASE: publish
      CI_PROFILE: source-ci
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require Successful Execution
        env:
          VALIDATION: ${{ needs.validate.result }}
          GENERAL: ${{ needs.publish-general.result }}
          PROJECTS: ${{ needs.publish-projects.result }}
          RULESETS: ${{ needs.publish-rulesets.result }}
        run: |
          test "$VALIDATION" = success
          test "$GENERAL" = success
          test "$PROJECTS" = success
          test "$RULESETS" = success
      - uses: actions/checkout@v7
        if: success()
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        if: success()
        with:
          node-version: 24
      - name: Receive Publication Records
        if: success()
        uses: actions/download-artifact@v8
        with:
          pattern: ci-publish-*
          merge-multiple: true
          path: build/run/${{ env.CI_RUN_ID }}/transport/bundles/
      - name: Verify Publication Components
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_ENVIRONMENT: ci-reporting
          CI_CREDENTIAL_APP_ID: ${{ vars.CI_APP_ID }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --stage-report

name: CI

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:
    inputs:
      operation:
        description: Configured operation identity
        type: string
        required: true
        default: validation
      publish:
        description: Authorize configured manual publication
        type: boolean
        required: true
        default: false

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: setup"
  resolve:
    name: Resolve Operation
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: resolve"
  authorize:
    name: Check Permissions
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: authorize"
  generate:
    name: Generate Pipeline
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: generate"
  execute:
    name: Run Pipeline
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: execute"
  collect:
    name: Collect Results
    needs: execute
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: collect"
  cleanup:
    name: Cleanup
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: cleanup"
  validate:
    name: validate
    needs: cleanup
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Diagnostic admission: validate"

name: CI

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:
    inputs:
      operation:
        description: Configured operation name from .github/config/ci/operations.json
        type: string
        required: true
        default: validation
      publish:
        description: Explicitly authorize manual publication
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  setup:
    runs-on: ubuntu-latest
    steps:
      - run: echo setup
  resolve:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - run: echo resolve
  authorize:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - run: echo authorize
  generate:
    runs-on: ubuntu-latest
    needs: authorize
    steps:
      - run: echo generate
  execute:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - run: echo execute
  collect:
    runs-on: ubuntu-latest
    needs: execute
    steps:
      - run: echo collect
  cleanup:
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - run: echo cleanup
  validate:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - run: echo validate

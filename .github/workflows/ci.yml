name: CI Publish

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-source
  cancel-in-progress: false

jobs:
  select-provider:
    # The entry validates the source ref on GitHub and allows local ACT checkouts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      provider: ${{ steps.select.outputs.provider }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Select credential provider
        id: select
        env:
          CI_PROFILE: source-ci
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --credential-provider

  gate:
    needs: select-provider
    if: needs.select-provider.outputs.provider == 'environment'
    name: gate
    environment:
      name: ci-bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      - name: Start bootstrap
        env:
          CI_PROFILE: source-ci
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_ENVIRONMENT: ci-bootstrap
          CI_CREDENTIAL_APP_ID: ${{ vars.CI_APP_ID }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
          CI_CREDENTIAL_BOOTSTRAP_TOKEN: ${{ secrets.CI_TOKEN }}
        run: dependencies/managed/bin/lute/lute run ci/entry.luau
      # Artifacts are diagnostic output; no publication operation occurs in this job.
      - name: Collect bootstrap output
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with: &bootstrap-output
          name: ci-start
          path: |
            build/run/ci-start/logs/
            build/run/ci-start/responses/
            build/run/ci-start/artifacts/workflow.yml
            build/run/ci-execution/
          if-no-files-found: ignore
      - name: Collect bootstrap output locally
        if: ${{ always() && env.ACT }}
        uses: actions/upload-artifact@v4
        with: *bootstrap-output

  gate-oidc:
    needs: select-provider
    if: needs.select-provider.outputs.provider == 'oidc'
    name: gate (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      - name: Start bootstrap
        env:
          CI_PROFILE: source-ci
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: dependencies/managed/bin/lute/lute run ci/entry.luau
      # Artifacts are diagnostic output; no publication operation occurs in this job.
      - name: Collect bootstrap output
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with: *bootstrap-output
      - name: Collect bootstrap output locally
        if: ${{ always() && env.ACT }}
        uses: actions/upload-artifact@v4
        with: *bootstrap-output

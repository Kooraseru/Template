name: CI

on:
  push:
  pull_request:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Optional operation from .github/config/ci/engine.json
        type: string
        required: false
        default: ""
      publish:
        description: Explicitly confirm manual publication
        type: boolean
        required: false
        default: false
      preview_target:
        description: "Manual preview target: pr:50, branch:feature/demo, or delete:pr:50"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    if: github.event_name != 'pull_request_target'
    uses: Kooraseru-Hub/CI-Engine/.github/workflows/bootstrap.yml@196feed4b093ab31ca0e98842539bee8a3a1bb41
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      operation: ${{ inputs.operation || '' }}
      publish: ${{ inputs.publish || false }}
    secrets:
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      bootstrap_token: ${{ secrets.CI_TOKEN }}

  preview-close:
    name: Preview / Retire closed PR
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ci-preview-cloudflare
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Retire Cloudflare preview alias
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI_PREVIEW_CLOSED_NUMBER: ${{ github.event.pull_request.number }}
        run: node ci/components/documentation/pages/publish/preview/publish.cjs --closed

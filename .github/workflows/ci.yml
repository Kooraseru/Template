name: CI

on:
  push:
  pull_request:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Select an available CI operation
        type: choice
        required: true
        default: validation
        options:
          - validation
          - readiness
          - rules-audit
          - build
          - publish
          - preview
      publish:
        description: Confirm publication for publish or preview
        type: boolean
        required: false
        default: false
      preview_kind:
        description: Preview action (used with operation preview)
        type: choice
        required: false
        default: pr
        options:
          - pr
          - branch
          - delete-pr
          - delete-branch
      preview_pr:
        description: PR number for pr or delete-pr (0 when unused)
        type: number
        required: false
        default: 0
      preview_branch:
        description: Existing branch name for branch or delete-branch
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    uses: Kooraseru-Hub/CI-Engine/.github/workflows/bootstrap.yml@564785f42deb5618719abd89099018488c1faf74
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
    with:
      operation: ${{ inputs.operation || '' }}
      publish: ${{ inputs.publish || false }}
    secrets:
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      bootstrap_token: ${{ secrets.CI_TOKEN }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

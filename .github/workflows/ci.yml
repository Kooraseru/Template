name: CI

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:
    inputs:
      operation:
        description: Configured operation name from .github/config/ci/operations.json
        type: string
        required: true
        default: validation
      publish:
        description: Explicitly authorize manual publication
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:

  setup:
    runs-on: ubuntu-latest
    steps:
      - run: echo setup

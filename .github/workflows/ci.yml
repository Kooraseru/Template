name: CI
on:
  pull_request_target:
    branches: [source]
  push:
    branches: [source]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to independently validate; 0 validates source and release selections'
        default: '0'
        type: string
      claim:
        description: 'Optional contributor receipt JSON for comparison'
        default: ''
        type: string
      bootstrap:
        description: 'First-install only: admin validates the exact activation PR controller'
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.context.outputs.runner }}
      build_matrix: ${{ steps.context.outputs.build_matrix }}
      rust: ${{ steps.context.outputs.rust }}
      cmake: ${{ steps.context.outputs.cmake }}
      rust_version: ${{ steps.context.outputs.rust_version }}
      cmake_version: ${{ steps.context.outputs.cmake_version }}
      repository: ${{ steps.context.outputs.repository }}
      pages: ${{ steps.context.outputs.pages }}
      release: ${{ steps.context.outputs.release }}
      images: ${{ steps.context.outputs.images }}
      publish_repository: ${{ steps.context.outputs.publish_repository }}
      publish_pages: ${{ steps.context.outputs.publish_pages }}
      publish_release: ${{ steps.context.outputs.publish_release }}
      image_matrix: ${{ steps.context.outputs.image_matrix }}
      release_matrix: ${{ steps.context.outputs.release_matrix }}
      build_requested: ${{ steps.context.outputs.build_requested }}
      receipt_ready: ${{ steps.context.outputs.receipt_ready }}
      local_execution: ${{ steps.context.outputs.local_execution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Resolve execution authority and tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs authorize
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: lune run ci/access/resolve.luau
      - run: lune run ci/validation/repository.luau
      - run: lune run ci/validation/workflows.luau
      - run: lune run ci/access/tests/policy.luau
      - run: lune run ci/access/tests/publication.luau
      - run: lune run ci/validation/tests/config.luau
      - run: lune run ci/validation/tests/catalogue.luau
      - run: lune run ci/validation/tests/artifacts.luau
      - run: lune run ci/validation/tests/rules.luau
      - run: lune run ci/validation/tests/gate.luau
      - run: node --test ci/releases/tests/*.test.mjs
      - run: node --test ci/receipts/tests/*.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-plan
          path: build/tmp/releases/plan.json
          if-no-files-found: error
  build:
    name: build (${{ matrix.name }})
    needs: [validate, images]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.build_requested == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CI_BUILD_TARGET: ${{ matrix.name }}
      CI_BUILD_SPEC: ${{ toJSON(matrix) }}
      CI_INPUT_REF: ${{ matrix.input_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Download reusable distribution
        if: matrix.cache_run != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: build/artifacts
          github-token: ${{ github.token }}
          run-id: ${{ matrix.cache_run }}
      - id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/releases/cli.mjs prepare
      - name: Download selected build image
        if: steps.prepared.outputs.reused != 'true' && matrix.image != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.image_artifact }}
          path: build/selected-image
      - name: Set up native MSVC
        if: steps.prepared.outputs.reused != 'true' && matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: ./.github/actions/setup-rust
        if: steps.prepared.outputs.reused != 'true' && matrix.image == '' && (contains(matrix.build.toolchains, 'rust') || matrix.profile == 'rust')
        with:
          toolchain: ${{ matrix.rust_version || matrix.build.rust_version }}
      - uses: ./.github/actions/setup-cmake
        if: steps.prepared.outputs.reused != 'true' && matrix.image == '' && contains(matrix.build.toolchains, 'cmake')
        with:
          version: ${{ matrix.build.cmake_version }}
      - run: lune run ci/build/run.luau
        if: steps.prepared.outputs.reused != 'true'
        env:
          CI_SOURCE_DIR: ${{ steps.prepared.outputs.source_dir }}
      - run: node ci/receipts/cli.mjs execution
        if: steps.prepared.outputs.reused != 'true'
      - run: lune run ci/distribution/package.luau
        if: steps.prepared.outputs.reused != 'true'
      - run: node ci/releases/cli.mjs verify build/artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: build/artifacts
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-logs-${{ matrix.source_sha }}-${{ matrix.name }}
          path: build/logs
  repository:
    needs: validate
    if: needs.validate.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/build-repo
      - name: Archive publication tree preserving file modes
        run: tar -cf build/repository.tar -C build/repo .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository
          path: build/repository.tar
          include-hidden-files: true
          if-no-files-found: error
  pages:
    needs: validate
    if: needs.validate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      - uses: ./.github/actions/build-pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-preview
          path: build/pages
          if-no-files-found: error
  release:
    needs: [validate, build]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: distribution-*
          path: build/distributions
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan
          path: build/tmp/releases
      - run: lune run ci/releases/build.luau
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: build/releases
          include-hidden-files: true
          if-no-files-found: error
  validation-receipt:
    needs: [validate, build, images]
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/source' || inputs.bootstrap) && needs.validate.outputs.local_execution == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
    concurrency:
      group: validation-pr-${{ inputs.pr || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan
          path: build/tmp/releases
      - name: Fetch tested objects without executing proposed controller code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs authorize
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: distribution-*
          path: build/distributions
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: build-logs-*
          path: build/validation-logs
      - run: node ci/receipts/cli.mjs collect
      - run: node ci/receipts/cli.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-receipt
          path: build/receipts/receipt.json
          retention-days: 30
          if-no-files-found: error
      - run: node ci/receipts/cli.mjs accepted-check
        env:
          GH_TOKEN: ${{ github.token }}
  gate:
    if: always()
    needs: [validate, build, repository, pages, release, images, validation-receipt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.validate.result == 'success'
        with:
          name: release-plan
          path: build/tmp/releases
      - name: Require accepted validation or independently requested execution
        if: needs.validate.result == 'success'
        run: node ci/receipts/cli.mjs check-ready
      - name: Require hosted receipt reporting
        if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.local_execution == 'false'
        env:
          RECEIPT_RESULT: ${{ needs.validation-receipt.result }}
        run: test "$RECEIPT_RESULT" = success
      - name: Require successful enabled jobs
        env:
          RESULTS: >-
            {"validate":{"result":"${{ needs.validate.result }}"},
            "build":{"result":"${{ needs.build.result }}"},
            "repository":{"result":"${{ needs.repository.result }}"},
            "pages":{"result":"${{ needs.pages.result }}"},
            "release":{"result":"${{ needs.release.result }}"},
            "images":{"result":"${{ needs.images.result }}"}}
          ENABLED: >-
            {"repository":"${{ needs.validate.outputs.repository }}",
            "pages":"${{ needs.validate.outputs.pages }}",
            "release":"${{ needs.validate.outputs.release }}",
            "images":"${{ needs.validate.outputs.images }}"}
        run: lune run ci/validation/gate.luau
      - name: Verify accepted PR validation and report the exact PR head
        if: github.event_name == 'pull_request_target' && needs.validate.outputs.local_execution == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs verify-pr
    permissions:
      contents: read
      actions: read
      checks: write

  publish-repository:
    concurrency:
      group: publication-main
      cancel-in-progress: false
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_repository == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repository
          path: build
      - name: Publish validated tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/repo/publish.sh

  images:
    name: images (${{ matrix.name }}, ${{ matrix.source_sha }})
    needs: validate
    if: needs.validate.outputs.images == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.image_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Build and export image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          CI_IMAGE_ID: ${{ matrix.artifact }}
          CI_INPUT_REF: ${{ matrix.input_ref }}
        run: lune run ci/images/build.luau "$IMAGE_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: build/images/${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error

  publish-pages:
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: publication-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Require hosted execution and source protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: lune run ci/access/require-publication.luau
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pages-preview
          path: build/pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  publish-release:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.release_matrix) }}
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publication-release-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
          path: build/releases
      - name: Publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ matrix.channel }}
        run: bash ci/releases/publish.sh

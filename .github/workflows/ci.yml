name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Starting bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start bootstrap
        shell: bash
        env:
          CI_EVENT: ${{ github.event_name }}
        run: bash ci/toolchain/lune.sh run ci/entry.luau

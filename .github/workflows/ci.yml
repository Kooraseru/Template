name: CI

on:
  push:
    branches: [source]
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Configured operation identity
        type: string
        required: true
        default: validation
      publish:
        description: Authorize configured manual publication
        type: boolean
        required: true
        default: false

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.controller.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install common controller dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      # Temporary migration probe; remove after the native lockfile is recorded.
      - name: Resolve pinned Mise toolchain and generate native lock
        env:
          MISE_YES: "1"
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/dependencies
          MISE_DATA_DIR: ${{ runner.temp }}/mise-probe-data
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mise-probe.tar.xz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/jdx/mise/releases/download/v2026.11.8/mise-v2026.11.8-linux-x64.tar.xz -o "$archive"
          echo "dfe43dca5b1ae781c39d50458094a5e28b3d4d8a74c52ae5a543f359d9ec2563  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mise-probe-extract"
          tar -xJf "$archive" -C "$RUNNER_TEMP/mise-probe-extract"
          binary="$(find "$RUNNER_TEMP/mise-probe-extract" -type f -name mise -print -quit)"
          test -n "$binary"
          "$binary" --version
          "$binary" -C dependencies lock --platform linux-x64,linux-arm64,windows-x64,windows-arm64,macos-arm64
          echo "MISE_LOCKFILE_BEGIN"
          cat dependencies/mise.lock
          echo "MISE_LOCKFILE_END"
          "$binary" -C dependencies install --locked github:luau-lang/lute
          "$binary" -C dependencies exec -- lute --version
      - name: Upload native Mise lockfile probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mise-lock-probe
          path: dependencies/mise.lock
          if-no-files-found: warn
          retention-days: 3
      - name: Test immutable controller contracts
        run: node --test ci/controller/contracts.test.cjs
      - name: Package verified dependency bundle
        id: controller
        run: node ci/controller/stages.cjs setup
      - name: Upload common toolchain
        uses: actions/upload-artifact@v7
        with:
          name: controller-toolchain
          path: build/ci-controller/toolchain/
          if-no-files-found: error
          retention-days: 3

  resolve:
    name: Resolve Operation
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      toolchain_digest: ${{ needs.setup.outputs.digest }}
      digest: ${{ steps.controller.outputs.digest }}
      operation: ${{ steps.controller.outputs.operation }}
      mode: ${{ steps.controller.outputs.mode }}
      setup_result: ${{ needs.setup.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Resolve configured operation
        id: controller
        env:
          CI_REQUESTED_OPERATION: ${{ inputs.operation }}
          CI_REQUESTED_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: node ci/controller/stages.cjs resolve
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-resolve
          path: build/ci-controller/artifacts/operation.json
          if-no-files-found: ignore
          retention-days: 3

  authorize:
    name: Check Permissions
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      operation_digest: ${{ needs.resolve.outputs.digest }}
      toolchain_digest: ${{ needs.resolve.outputs.toolchain_digest }}
      digest: ${{ steps.controller.outputs.digest }}
      bootstrap_environment: ${{ steps.controller.outputs.environment }}
      reporting_environment: ${{ steps.controller.outputs.reporting_environment }}
      app_id_name: ${{ steps.controller.outputs.app_id_name }}
      app_key_name: ${{ steps.controller.outputs.app_key_name }}
      bootstrap_token_name: ${{ steps.controller.outputs.bootstrap_token_name }}
      report_app_id_name: ${{ steps.controller.outputs.report_app_id_name }}
      report_app_key_name: ${{ steps.controller.outputs.report_app_key_name }}
      setup_result: ${{ needs.resolve.outputs.setup_result }}
      resolve_result: ${{ needs.resolve.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Restore controller dependency archive
        uses: actions/download-artifact@v4
        with:
          name: controller-toolchain
          path: build/ci-controller/toolchain
      - name: Verify and extract common dependencies
        env:
          CI_TOOLCHAIN_DIGEST: ${{ needs.resolve.outputs.toolchain_digest }}
        run: node ci/controller/stages.cjs restore
      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Plan capability-scoped authorization
        id: controller
        env:
          CI_OPERATION_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: node ci/controller/stages.cjs authorize
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-authorize
          path: build/ci-controller/artifacts/authorization.json
          if-no-files-found: ignore
          retention-days: 3

  generate:
    name: Generate Pipeline
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.controller.outputs.mode }}
      operation_digest: ${{ needs.authorize.outputs.operation_digest }}
      authorization_digest: ${{ needs.authorize.outputs.digest }}
      toolchain_digest: ${{ needs.authorize.outputs.toolchain_digest }}
      digest: ${{ steps.controller.outputs.digest }}
      bootstrap_environment: ${{ needs.authorize.outputs.bootstrap_environment }}
      reporting_environment: ${{ needs.authorize.outputs.reporting_environment }}
      app_id_name: ${{ needs.authorize.outputs.app_id_name }}
      app_key_name: ${{ needs.authorize.outputs.app_key_name }}
      bootstrap_token_name: ${{ needs.authorize.outputs.bootstrap_token_name }}
      report_app_id_name: ${{ needs.authorize.outputs.report_app_id_name }}
      report_app_key_name: ${{ needs.authorize.outputs.report_app_key_name }}
      setup_result: ${{ needs.authorize.outputs.setup_result }}
      resolve_result: ${{ needs.authorize.outputs.resolve_result }}
      authorize_result: ${{ needs.authorize.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Restore controller dependency archive
        uses: actions/download-artifact@v4
        with:
          name: controller-toolchain
          path: build/ci-controller/toolchain
      - name: Verify and extract common dependencies
        env:
          CI_TOOLCHAIN_DIGEST: ${{ needs.authorize.outputs.toolchain_digest }}
        run: node ci/controller/stages.cjs restore
      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Compile but do not execute generated pipeline
        id: controller
        env:
          CI_OPERATION_DIGEST: ${{ needs.authorize.outputs.operation_digest }}
          CI_AUTHORIZATION_DIGEST: ${{ needs.authorize.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: node ci/controller/stages.cjs generate
      - name: Upload compiled pipeline
        uses: actions/upload-artifact@v7
        with:
          name: controller-generated
          path: build/ci-controller/generated/
          if-no-files-found: error
          retention-days: 3
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-generate
          path: build/ci-controller/artifacts/pipeline.json
          if-no-files-found: ignore
          retention-days: 3

  execute:
    name: Run Pipeline
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.generate.outputs.mode == 'generated') && needs.generate.outputs.bootstrap_environment || 'ci-untrusted' }}
    outputs:
      mode: ${{ needs.generate.outputs.mode }}
      operation_digest: ${{ needs.generate.outputs.operation_digest }}
      authorization_digest: ${{ needs.generate.outputs.authorization_digest }}
      pipeline_digest: ${{ needs.generate.outputs.digest }}
      toolchain_digest: ${{ needs.generate.outputs.toolchain_digest }}
      digest: ${{ steps.controller.outputs.digest }}
      bootstrap_environment: ${{ needs.generate.outputs.bootstrap_environment }}
      reporting_environment: ${{ needs.generate.outputs.reporting_environment }}
      app_id_name: ${{ needs.generate.outputs.app_id_name }}
      app_key_name: ${{ needs.generate.outputs.app_key_name }}
      bootstrap_token_name: ${{ needs.generate.outputs.bootstrap_token_name }}
      report_app_id_name: ${{ needs.generate.outputs.report_app_id_name }}
      report_app_key_name: ${{ needs.generate.outputs.report_app_key_name }}
      setup_result: ${{ needs.generate.outputs.setup_result }}
      resolve_result: ${{ needs.generate.outputs.resolve_result }}
      authorize_result: ${{ needs.generate.outputs.authorize_result }}
      generate_result: ${{ needs.generate.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Restore controller dependency archive
        uses: actions/download-artifact@v4
        with:
          name: controller-toolchain
          path: build/ci-controller/toolchain
      - name: Verify and extract common dependencies
        env:
          CI_TOOLCHAIN_DIGEST: ${{ needs.generate.outputs.toolchain_digest }}
        run: node ci/controller/stages.cjs restore
      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Retrieve compiled pipeline
        uses: actions/download-artifact@v4
        with:
          name: controller-generated
          path: build/ci-controller/generated
      - name: Launch and await pipeline completion
        id: controller
        env:
          CI_OPERATION_DIGEST: ${{ needs.generate.outputs.operation_digest }}
          CI_AUTHORIZATION_DIGEST: ${{ needs.generate.outputs.authorization_digest }}
          CI_PIPELINE_DIGEST: ${{ needs.generate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_APP_ID: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.generate.outputs.mode == 'generated') && vars[needs.generate.outputs.app_id_name] || '' }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.generate.outputs.mode == 'generated') && secrets[needs.generate.outputs.app_key_name] || '' }}
          CI_CREDENTIAL_BOOTSTRAP_TOKEN: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.generate.outputs.mode == 'generated') && secrets[needs.generate.outputs.bootstrap_token_name] || '' }}
        run: node ci/controller/stages.cjs run
      - name: Preserve read-only component diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-execution-diagnostics
          path: |
            build/ci-controller/logs/
            build/code-review/
            build/rules-audit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-execute
          path: build/ci-controller/artifacts/execution.json
          if-no-files-found: ignore
          retention-days: 3

  collect:
    name: Collect Results
    needs: execute
    if: ${{ always() }}
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.execute.outputs.mode == 'generated') && needs.execute.outputs.reporting_environment || 'ci-untrusted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ needs.execute.outputs.mode }}
      operation_digest: ${{ needs.execute.outputs.operation_digest }}
      authorization_digest: ${{ needs.execute.outputs.authorization_digest }}
      pipeline_digest: ${{ needs.execute.outputs.pipeline_digest }}
      execution_digest: ${{ needs.execute.outputs.digest }}
      digest: ${{ steps.controller.outputs.digest }}
      bootstrap_environment: ${{ needs.execute.outputs.bootstrap_environment }}
      reporting_environment: ${{ needs.execute.outputs.reporting_environment }}
      app_id_name: ${{ needs.execute.outputs.app_id_name }}
      app_key_name: ${{ needs.execute.outputs.app_key_name }}
      bootstrap_token_name: ${{ needs.execute.outputs.bootstrap_token_name }}
      report_app_id_name: ${{ needs.execute.outputs.report_app_id_name }}
      report_app_key_name: ${{ needs.execute.outputs.report_app_key_name }}
      setup_result: ${{ needs.execute.outputs.setup_result }}
      resolve_result: ${{ needs.execute.outputs.resolve_result }}
      authorize_result: ${{ needs.execute.outputs.authorize_result }}
      generate_result: ${{ needs.execute.outputs.generate_result }}
      run_result: ${{ needs.execute.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Download available execution diagnostics
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: controller-execution-*
          merge-multiple: true
          path: build/ci-controller/diagnostics
      - name: Collect component outcomes and diagnostics
        id: controller
        env:
          CI_OPERATION_DIGEST: ${{ needs.execute.outputs.operation_digest }}
          CI_EXECUTION_DIGEST: ${{ needs.execute.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: node ci/controller/stages.cjs collect
      - name: Upload consolidated human report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-report
          path: build/ci-controller/report.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-collect
          path: build/ci-controller/artifacts/results.json
          if-no-files-found: ignore
          retention-days: 3

  cleanup:
    name: Cleanup
    needs: collect
    if: ${{ always() }}
    environment:
      name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.collect.outputs.mode == 'generated') && needs.collect.outputs.bootstrap_environment || 'ci-untrusted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ needs.collect.outputs.mode }}
      operation_digest: ${{ needs.collect.outputs.operation_digest }}
      authorization_digest: ${{ needs.collect.outputs.authorization_digest }}
      pipeline_digest: ${{ needs.collect.outputs.pipeline_digest }}
      execution_digest: ${{ needs.collect.outputs.execution_digest }}
      results_digest: ${{ needs.collect.outputs.digest }}
      digest: ${{ steps.controller.outputs.digest }}
      bootstrap_environment: ${{ needs.collect.outputs.bootstrap_environment }}
      reporting_environment: ${{ needs.collect.outputs.reporting_environment }}
      app_id_name: ${{ needs.collect.outputs.app_id_name }}
      app_key_name: ${{ needs.collect.outputs.app_key_name }}
      bootstrap_token_name: ${{ needs.collect.outputs.bootstrap_token_name }}
      report_app_id_name: ${{ needs.collect.outputs.report_app_id_name }}
      report_app_key_name: ${{ needs.collect.outputs.report_app_key_name }}
      setup_result: ${{ needs.collect.outputs.setup_result }}
      resolve_result: ${{ needs.collect.outputs.resolve_result }}
      authorize_result: ${{ needs.collect.outputs.authorize_result }}
      generate_result: ${{ needs.collect.outputs.generate_result }}
      run_result: ${{ needs.collect.outputs.run_result }}
      collect_result: ${{ needs.collect.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Remove only owned temporary resources
        id: controller
        env:
          CI_OPERATION_DIGEST: ${{ needs.collect.outputs.operation_digest }}
          CI_EXECUTION_DIGEST: ${{ needs.collect.outputs.execution_digest }}
          GH_TOKEN: ${{ github.token }}
          CI_CREDENTIAL_APP_ID: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.collect.outputs.mode == 'generated') && vars[needs.collect.outputs.app_id_name] || '' }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.collect.outputs.mode == 'generated') && secrets[needs.collect.outputs.app_key_name] || '' }}
          CI_CREDENTIAL_BOOTSTRAP_TOKEN: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.collect.outputs.mode == 'generated') && secrets[needs.collect.outputs.bootstrap_token_name] || '' }}
        run: node ci/controller/stages.cjs cleanup
      - name: Preserve typed stage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-manifest-cleanup
          path: build/ci-controller/artifacts/cleanup.json
          if-no-files-found: ignore
          retention-days: 3

  validate:
    name: validate
    needs: cleanup
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      setup_result: ${{ needs.cleanup.outputs.setup_result }}
      resolve_result: ${{ needs.cleanup.outputs.resolve_result }}
      authorize_result: ${{ needs.cleanup.outputs.authorize_result }}
      generate_result: ${{ needs.cleanup.outputs.generate_result }}
      run_result: ${{ needs.cleanup.outputs.run_result }}
      collect_result: ${{ needs.cleanup.outputs.collect_result }}
      cleanup_result: ${{ needs.cleanup.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Restore upstream controller manifests
        uses: actions/download-artifact@v4
        with:
          pattern: controller-manifest-*
          merge-multiple: true
          path: build/ci-controller/artifacts
      - name: Verify all eight stages and the final pipeline conclusion
        env:
          CI_OPERATION_DIGEST: ${{ needs.cleanup.outputs.operation_digest }}
          CI_AUTHORIZATION_DIGEST: ${{ needs.cleanup.outputs.authorization_digest }}
          CI_PIPELINE_DIGEST: ${{ needs.cleanup.outputs.pipeline_digest }}
          CI_EXECUTION_DIGEST: ${{ needs.cleanup.outputs.execution_digest }}
          CI_RESULTS_DIGEST: ${{ needs.cleanup.outputs.results_digest }}
          CI_CLEANUP_DIGEST: ${{ needs.cleanup.outputs.digest }}
          CI_JOB_SETUP: ${{ needs.cleanup.outputs.setup_result }}
          CI_JOB_RESOLVE: ${{ needs.cleanup.outputs.resolve_result }}
          CI_JOB_AUTHORIZE: ${{ needs.cleanup.outputs.authorize_result }}
          CI_JOB_GENERATE: ${{ needs.cleanup.outputs.generate_result }}
          CI_JOB_RUN: ${{ needs.cleanup.outputs.run_result }}
          CI_JOB_COLLECT: ${{ needs.cleanup.outputs.collect_result }}
          CI_JOB_CLEANUP: ${{ needs.cleanup.result }}
        run: node ci/controller/stages.cjs validate

name: CI
run-name: "CI / ${{ inputs.operation || github.event_name }} / ${{ inputs.pull_request || github.ref_name }}"
env:
  CI_CONTROL_INPUTS: ${{ toJSON(inputs) }}
  CI_SOURCE_PROTECTION: ${{ vars.CI_SOURCE_PROTECTION }}
on:
  pull_request_target:
    branches: [source]
    types: [opened, synchronize, reopened, edited, closed, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [source]
  workflow_dispatch:
    inputs:
      operation:
        description: "Run / Operation"
        type: choice
        default: "Validate"
        options:
          - "Validate"
          - "Build"
          - "Publish"
          - "Full Run"
      pull_request:
        description: "Run / Pull request"
        type: choice
        default: "Source"
        # BEGIN GENERATED PR CHOICES
        options:
          - "Source"
        # END GENERATED PR CHOICES
      validation_scope:
        description: "Validate / Scope"
        type: choice
        default: "All"
        options:
          - "All"
          - "Configuration"
          - "Workflow rules"
          - "Access policy"
          - "Receipts"
          - "Release tooling"
      build_targets:
        description: "Build / Targets"
        type: choice
        default: "Configured"
        options:
          - "Configured"
          - "All supported"
          - "Linux"
          - "Windows"
          - "macOS"
          - "alpine-gcc-x64"
          - "alpine-gcc-arm64"
          - "alpine-clang-x64"
          - "alpine-clang-arm64"
          - "alpine-rust-x64"
          - "alpine-rust-arm64"
          - "debian-gcc-x64"
          - "debian-gcc-arm64"
          - "debian-clang-x64"
          - "debian-clang-arm64"
          - "debian-rust-x64"
          - "debian-rust-arm64"
          - "debian-mingw-x64"
          - "debian-mingw-arm64"
          - "ubuntu-gcc-x64"
          - "ubuntu-gcc-arm64"
          - "ubuntu-clang-x64"
          - "ubuntu-clang-arm64"
          - "fedora-gcc-x64"
          - "fedora-gcc-arm64"
          - "fedora-clang-x64"
          - "fedora-clang-arm64"
          - "arch-gcc-x64"
          - "arch-clang-x64"
          - "windows-msvc-x64"
          - "windows-rust-x64"
          - "windows-msvc-arm64"
          - "windows-rust-arm64"
          - "macos-clang-x64"
          - "macos-rust-x64"
          - "macos-clang-arm64"
          - "macos-rust-arm64"
      compiler:
        description: "Build / Compiler filter"
        type: choice
        default: "Any"
        options:
          - "Any"
          - "GCC"
          - "Clang"
          - "MSVC"
          - "MinGW"
          - "Rust"
      architecture:
        description: "Build / Architecture filter"
        type: choice
        default: "Any"
        options:
          - "Any"
          - "x64"
          - "ARM64"
      images:
        description: "Build / Container images"
        type: choice
        default: "Configured"
        options:
          - "Configured"
          - "Skip"
          - "Required by selected builds"
          - "All catalogue images"
      repository_output:
        description: "Outputs / Repository"
        type: choice
        default: "Configured"
        options:
          - "Configured"
          - "Skip"
          - "Generate only"
          - "Generate and publish"
      documentation_output:
        description: "Outputs / Documentation"
        type: choice
        default: "Configured"
        options:
          - "Configured"
          - "Skip"
          - "Generate only"
          - "Generate and publish"
      release_output:
        description: "Outputs / Releases"
        type: choice
        default: "Configured"
        options:
          - "Configured"
          - "Skip"
          - "Assemble only"
          - "Publish Release"
          - "Publish Pre-Release"
      cache_policy:
        description: "Policy / Cache"
        type: choice
        default: "Reuse matching results"
        options:
          - "Reuse matching results"
          - "Rebuild outputs"
          - "Rebuild images and outputs"
          - "Require stored results"
      gate_policy:
        description: "Policy / Gates"
        type: choice
        default: "Enforce all"
        options:
          - "Enforce all"
          - "Ignore validation failures"
          - "Ignore incomplete coverage"
          - "Ignore both"
      release_version:
        description: "Release / Version (optional override, paired with source commit)"
        type: string
        default: ""
      release_commit:
        description: "Release / Source commit (full SHA, paired with version)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read
jobs:
  refresh-prs:
    name: Maintenance / Pull request choices
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: ci-pr-dropdown
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source
          persist-credentials: false
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Refresh open pull request choices
        env:
          GH_TOKEN: ${{ secrets.CI_WORKFLOW_TOKEN || github.token }}
        run: node ci/control/refresh-prs.mjs --remote

  validate:
    name: Validate / Plan and checks
    if: github.event_name != 'schedule' && github.event.action != 'closed' && github.event.action != 'edited'
    permissions:
      contents: write # Draft staging releases require write access to read.
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.dispatch.outputs.operation }}
      ignore_validation: ${{ steps.dispatch.outputs.ignore_validation }}
      ignore_coverage: ${{ steps.dispatch.outputs.ignore_coverage }}
      pr: ${{ steps.dispatch.outputs.pr }}
      diagnostic: ${{ steps.dispatch.outputs.diagnostic }}
      runner: ${{ steps.context.outputs.runner }}
      build_matrix: ${{ steps.context.outputs.build_matrix }}
      rust: ${{ steps.context.outputs.rust }}
      cmake: ${{ steps.context.outputs.cmake }}
      rust_version: ${{ steps.context.outputs.rust_version }}
      cmake_version: ${{ steps.context.outputs.cmake_version }}
      repository: ${{ steps.context.outputs.repository }}
      pages: ${{ steps.context.outputs.pages }}
      release: ${{ steps.context.outputs.release }}
      images: ${{ steps.context.outputs.images }}
      publish_repository: ${{ steps.context.outputs.publish_repository }}
      publish_pages: ${{ steps.context.outputs.publish_pages }}
      publish_release: ${{ steps.context.outputs.publish_release }}
      image_matrix: ${{ steps.context.outputs.image_matrix }}
      release_matrix: ${{ steps.context.outputs.release_matrix }}
      build_requested: ${{ steps.context.outputs.build_requested }}
      receipt_ready: ${{ steps.context.outputs.receipt_ready }}
      accepted_available: ${{ steps.context.outputs.accepted_available }}
      local_execution: ${{ steps.context.outputs.local_execution }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Resolve operation and administrator controls
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/control/dispatch.mjs
      - name: Resolve execution authority and tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs authorize
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: lune run ci/access/resolve.luau
      - name: Validate / Selected checks
        id: checks
        continue-on-error: ${{ steps.dispatch.outputs.ignore_validation == 'true' }}
        run: node ci/control/validate.mjs
      - name: Evidence / Store validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence
          path: build/validation
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: build/tmp/releases/plan.json
          if-no-files-found: error
      - name: Transfer verified accepted distributions
        if: steps.context.outputs.accepted_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: accepted-distributions
          path: build/accepted-distributions
          include-hidden-files: true
          if-no-files-found: error
      - name: Transfer verified accepted logs
        if: steps.context.outputs.accepted_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: accepted-logs
          path: build/accepted-logs
          if-no-files-found: error

  images:
    name: Build / Images (${{ matrix.name }})
    needs: validate
    if: needs.validate.outputs.images == 'true' && needs.validate.outputs.operation != 'Validate'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.image_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Cache / Restore image archive
        id: image-cache
        if: inputs.cache_policy != 'Rebuild images and outputs'
        uses: actions/cache/restore@v6
        with:
          path: build/images/${{ matrix.name }}
          key: ci-image-${{ matrix.artifact }}
      - name: Build and export image
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          CI_IMAGE_ID: ${{ matrix.artifact }}
          CI_INPUT_REF: ${{ matrix.input_ref }}
        run: lune run ci/images/build.luau "$IMAGE_NAME"
      - name: Cache / Store image archive
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/images/${{ matrix.name }}
          key: ci-image-${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/images/${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build / Targets (${{ matrix.name }})
    needs: [validate, images]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.build_requested == 'true' && needs.validate.outputs.operation != 'Validate' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CI_BUILD_TARGET: ${{ matrix.name }}
      CI_BUILD_SPEC: ${{ toJSON(matrix) }}
      CI_INPUT_REF: ${{ matrix.input_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Download verified accepted distributions
        if: matrix.accepted
        uses: actions/download-artifact@v8
        with:
          name: accepted-distributions
          path: build/accepted-distributions
      - name: Download verified accepted logs
        if: matrix.accepted
        uses: actions/download-artifact@v8
        with:
          name: accepted-logs
          path: build/accepted-logs
      - id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/releases/cli.mjs prepare
      - name: Download selected build image
        if: steps.prepared.outputs.reused != 'true' && matrix.image != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.image_artifact }}
          path: build/selected-image
      - name: Set up native MSVC
        if: steps.prepared.outputs.reused != 'true' && matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - uses: ./.github/actions/setup-rust
        if: steps.prepared.outputs.reused != 'true' && matrix.image == '' && (contains(matrix.build.toolchains, 'rust') || matrix.profile == 'rust')
        with:
          toolchain: ${{ matrix.rust_version || matrix.build.rust_version }}
      - uses: ./.github/actions/setup-cmake
        if: steps.prepared.outputs.reused != 'true' && matrix.image == '' && contains(matrix.build.toolchains, 'cmake')
        with:
          version: ${{ matrix.build.cmake_version }}
      - run: lune run ci/build/run.luau
        if: steps.prepared.outputs.reused != 'true'
        env:
          CI_SOURCE_DIR: ${{ steps.prepared.outputs.source_dir }}
      - run: node ci/receipts/cli.mjs execution
        if: steps.prepared.outputs.reused != 'true'
      - run: lune run ci/distribution/package.luau
        if: steps.prepared.outputs.reused != 'true'
      - run: node ci/releases/cli.mjs verify build/artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/artifacts
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs-${{ matrix.source_sha }}-${{ matrix.name }}
          path: build/logs

  repository:
    name: Build / Repository
    needs: validate
    if: needs.validate.outputs.repository == 'true' && needs.validate.outputs.operation != 'Validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/build-repo
      - name: Archive publication tree preserving file modes
        run: tar -cf build/repository.tar -C build/repo .
      - uses: actions/upload-artifact@v7
        with:
          name: repository
          path: build/repository.tar
          include-hidden-files: true
          if-no-files-found: error

  pages:
    name: Build / Documentation
    needs: validate
    if: needs.validate.outputs.pages == 'true' && needs.validate.outputs.operation != 'Validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      - uses: ./.github/actions/build-pages
      - uses: actions/upload-artifact@v7
        with:
          name: pages-preview
          path: build/pages
          if-no-files-found: error

  release:
    name: Build / Release assembly
    needs: [validate, build, validation-receipt]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' && (needs.validation-receipt.result == 'success' || needs.validation-receipt.result == 'skipped') && needs.validate.outputs.release == 'true' && needs.validate.outputs.operation != 'Validate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: build/distributions
      - uses: actions/download-artifact@v8
        if: needs.validation-receipt.result != 'success'
        with:
          name: release-plan
          path: build/tmp/releases
      - uses: actions/download-artifact@v8
        if: needs.validation-receipt.result == 'success'
        with:
          name: accepted-release-plan
          path: build/tmp/accepted
      - name: Evidence / Select accepted release plan
        if: needs.validation-receipt.result == 'success'
        run: node -e "require('fs').mkdirSync('build/tmp/releases', {recursive:true}); require('fs').copyFileSync('build/tmp/accepted/accepted-plan.json', 'build/tmp/releases/plan.json')"
      - run: lune run ci/releases/build.luau
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: build/releases
          include-hidden-files: true
          if-no-files-found: error

  validation-receipt:
    name: Evidence / Build receipts
    needs: [validate, build, images]
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/source' || needs.validate.outputs.pr != '0') && needs.validate.outputs.local_execution == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: write
    concurrency:
      group: validation-pr-${{ needs.validate.outputs.pr || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: build/tmp/releases
      - name: Fetch tested objects without executing proposed controller code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs authorize
      - uses: actions/download-artifact@v8
        with:
          pattern: distribution-*
          path: build/distributions
      - uses: actions/download-artifact@v8
        with:
          pattern: build-logs-*
          path: build/validation-logs
      - run: node ci/receipts/cli.mjs collect
      - run: node ci/receipts/cli.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: validation-receipt
          path: build/receipts/receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Evidence / Store accepted release plan
        uses: actions/upload-artifact@v7
        with:
          name: accepted-release-plan
          path: build/receipts/accepted-plan.json
          if-no-files-found: error
      - run: node ci/receipts/cli.mjs accepted-check
        env:
          GH_TOKEN: ${{ github.token }}

  gate:
    # Keep this status-check name stable for existing source protection.
    if: always() && github.event_name != 'schedule' && github.event.action != 'closed' && github.event.action != 'edited'
    needs: [validate, build, repository, pages, release, images, validation-receipt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        if: needs.validate.result == 'success'
        with:
          name: release-plan
          path: build/tmp/releases
      - name: Gate / Selected stages and policies
        env:
          RESULTS: >-
            {"validate":{"result":"${{ needs.validate.result }}"},
            "build":{"result":"${{ needs.build.result }}"},
            "repository":{"result":"${{ needs.repository.result }}"},
            "pages":{"result":"${{ needs.pages.result }}"},
            "release":{"result":"${{ needs.release.result }}"},
            "images":{"result":"${{ needs.images.result }}"},
            "validation-receipt":{"result":"${{ needs.validation-receipt.result }}"}}
          ENABLED: >-
            {"repository":"${{ needs.validate.outputs.repository }}",
            "pages":"${{ needs.validate.outputs.pages }}",
            "release":"${{ needs.validate.outputs.release }}",
            "images":"${{ needs.validate.outputs.images }}"}
        run: node ci/control/gate.mjs
      - name: Verify accepted PR validation and report the exact PR head
        if: github.event_name == 'pull_request_target' && needs.validate.outputs.local_execution == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/receipts/cli.mjs verify-pr
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: write

  publish-repository:
    env:
      CI_PUBLICATION_JOB: 'true'
    name: Publish / Repository
    concurrency:
      group: publication-main
      cancel-in-progress: false
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_repository == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: repository
          path: build
      - name: Publish validated tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/repo/publish.sh

  publish-pages:
    env:
      CI_PUBLICATION_JOB: 'true'
    name: Publish / Documentation
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_pages == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: publication-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - name: Require hosted execution and source protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: lune run ci/access/require-publication.luau
      - uses: actions/download-artifact@v8
        with:
          name: pages-preview
          path: build/pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v5

  publish-release:
    env:
      CI_PUBLICATION_JOB: 'true'
    name: Publish / ${{ matrix.type }} (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.release_matrix) }}
    needs: [validate, gate]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/source' && needs.validate.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
      actions: read
    concurrency:
      group: publication-version-${{ matrix.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-lune
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: build/releases
      - name: Publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: bash ci/releases/publish.sh

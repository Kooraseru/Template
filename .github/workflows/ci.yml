name: CI Start Workflow

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The bootstrap reads credential names from targets.toml for both events.
      - name: Resolve credential names
        id: credentials
        run: node dependencies/packages/dependencyLoader/index.ts --exec luau.lute run .github/ci/entry.luau --credential-names
      # Source pushes, manual runs, and trusted PRs share the entry point and preserve event-specific boundaries.
      - name: Start bootstrap
        env:
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CI_PUBLISH_RELEASES: ${{ github.event_name == 'push' && 'true' || '' }}
          CI_PUBLISH_PACKAGES: ${{ github.event_name == 'push' && vars.CI_PUBLISH_PACKAGES || '' }}
          CI_PUBLISH_BRANCHES: ${{ github.event_name == 'push' && vars.CI_PUBLISH_BRANCHES || '' }}
          CI_PUBLISH_PAGES: ${{ github.event_name == 'push' && vars.CI_PUBLISH_PAGES || '' }}
          CI_GITHUB_APP_ID_SECRET: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && secrets[steps.credentials.outputs.app_id] || '' }}
          CI_GITHUB_APP_ID_VARIABLE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && vars[steps.credentials.outputs.app_id] || '' }}
          CI_GITHUB_APP_PRIVATE_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && secrets[steps.credentials.outputs.app_private_key] || '' }}
          CI_GITHUB_BOOTSTRAP_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && secrets[steps.credentials.outputs.bootstrap_token] || '' }}
          CI_GITHUB_PROJECTS_TOKEN: ${{ github.event_name == 'push' && secrets[steps.credentials.outputs.projects_token] || '' }}
          CI_GITHUB_RULESETS_TOKEN: ${{ github.event_name == 'push' && secrets[steps.credentials.outputs.rulesets_token] || '' }}
        run: bash .github/ci/integrations/github/workflows/run-logged.sh ci-start bootstrap
      # Artifacts are diagnostic output; no publication operation occurs in this job.
      - name: Collect bootstrap output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-start
          path: |
            build/run/ci-start/logs/
            build/run/ci-start/responses/
            build/run/ci-start/artifacts/workflow.yml
            build/run/ci-execution/
          if-no-files-found: ignore

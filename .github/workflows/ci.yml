name: CI Start Workflow

on:
  push:
    branches: [source]

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-source
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Starting bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve credential names
        id: credentials
        run: bash dependencies/lune/bootstrap.sh run repo/ci/entry.luau --credential-names
      - name: Start bootstrap
        env:
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CI_PUBLISH_RELEASES: ${{ vars.CI_PUBLISH_RELEASES }}
          CI_PUBLISH_PACKAGES: ${{ vars.CI_PUBLISH_PACKAGES }}
          CI_PUBLISH_BRANCHES: ${{ vars.CI_PUBLISH_BRANCHES }}
          CI_PUBLISH_PAGES: ${{ vars.CI_PUBLISH_PAGES }}
          CI_GITHUB_APP_ID_SECRET: ${{ secrets[steps.credentials.outputs.app_id] }}
          CI_GITHUB_APP_ID_VARIABLE: ${{ vars[steps.credentials.outputs.app_id] }}
          CI_GITHUB_APP_PRIVATE_KEY: ${{ secrets[steps.credentials.outputs.app_private_key] }}
          CI_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets[steps.credentials.outputs.bootstrap_token] }}
          CI_GITHUB_PROJECTS_TOKEN: ${{ secrets[steps.credentials.outputs.projects_token] }}
        run: |
          mkdir -p build/run/ci-start/logs
          set -o pipefail
          bash dependencies/lune/bootstrap.sh run repo/ci/entry.luau 2>&1 | tee build/run/ci-start/logs/bootstrap.log
      - name: Collect bootstrap output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-start
          path: |
            build/run/ci-start/logs/
            build/run/ci-start/responses/
            build/run/ci-start/artifacts/workflow.yml
            build/run/ci-execution/
          if-no-files-found: ignore

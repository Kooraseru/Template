name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Optional operation from .github/config/ci/engine.json
        type: string
        required: false
        default: ""
      publish:
        description: Explicitly confirm manual publication
        type: boolean
        required: false
        default: false
      preview_target:
        description: "Manual preview target: pr:50, branch:feature/demo, or delete:pr:50"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    uses: Kooraseru-Hub/CI-Engine/.github/workflows/bootstrap.yml@196feed4b093ab31ca0e98842539bee8a3a1bb41
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      operation: ${{ inputs.operation || '' }}
      publish: ${{ inputs.publish || false }}
    secrets:
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      bootstrap_token: ${{ secrets.CI_TOKEN }}

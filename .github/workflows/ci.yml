name: CI

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:
    inputs:
      operation:
        description: Configured operation name from .github/config/ci/operations.json
        type: string
        required: true
        default: validation
      publish:
        description: Explicitly authorize manual publication
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve CI Operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      mode: ${{ steps.route.outputs.mode }}
      environment: ${{ steps.route.outputs.environment }}
      app_id_name: ${{ steps.route.outputs.app_id_name }}
      app_private_key_name: ${{ steps.route.outputs.app_private_key_name }}
      bootstrap_token_name: ${{ steps.route.outputs.bootstrap_token_name }}
      plan: ${{ steps.route.outputs.plan }}
      publication: ${{ steps.route.outputs.publication }}
      branch_prefix: ${{ steps.route.outputs.branch_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Resolve configured operation
        id: route
        env:
          CI_REQUESTED_OPERATION: ${{ inputs.operation }}
          CI_REQUESTED_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: node ci/bootstrap/routes.cjs resolve

  review:
    name: Code Review
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'readonly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Execute configured read-only checks
        env:
          CI_REQUESTED_OPERATION: ${{ needs.resolve.outputs.operation }}
        run: node ci/bootstrap/routes.cjs run
      - name: Preserve full diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-review-findings
          path: build/code-review/
          if-no-files-found: ignore
          retention-days: 7

  bootstrap:
    name: Start Generated CI
    needs: resolve
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/source' && needs.resolve.outputs.mode == 'generated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Compile, launch, and verify generated execution
        env:
          CI_EVENT: push
          CI_PROFILE: source-ci
          CI_OPERATION: ${{ needs.resolve.outputs.plan }}
          CI_PUBLICATION_ENABLED: ${{ needs.resolve.outputs.publication }}
          CI_EXECUTION_PREFIX: ${{ needs.resolve.outputs.branch_prefix }}
          CI_CREDENTIAL_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          CI_CREDENTIAL_APP_ID: ${{ vars[needs.resolve.outputs.app_id_name] }}
          CI_CREDENTIAL_APP_PRIVATE_KEY: ${{ secrets[needs.resolve.outputs.app_private_key_name] }}
          CI_CREDENTIAL_BOOTSTRAP_TOKEN: ${{ secrets[needs.resolve.outputs.bootstrap_token_name] }}
          GH_TOKEN: ${{ github.token }}
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau
      - name: Preserve bootstrap output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: start
          path: build/run/${{ env.CI_LOCAL_RUN_ID || format('{0}-{1}', github.run_id, github.run_attempt) }}/start/
          if-no-files-found: ignore
          retention-days: 3

  validate:
    name: validate
    if: always()
    needs: [resolve, review, bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require completed selected route
        env:
          RESOLVE: ${{ needs.resolve.result }}
          MODE: ${{ needs.resolve.outputs.mode }}
          REVIEW: ${{ needs.review.result }}
          BOOTSTRAP: ${{ needs.bootstrap.result }}
        run: |
          test "$RESOLVE" = success
          case "$MODE" in
            readonly) test "$REVIEW" = success ;;
            generated) test "$BOOTSTRAP" = success ;;
            *) echo "No valid execution route completed" >&2; exit 1 ;;
          esac

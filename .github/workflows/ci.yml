name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Optional configured operation
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bootstrap:
    uses: Kooraseru-Hub/CI-Engine/.github/workflows/bootstrap.yml@6634c2ca293a4a3668f2e7b32fe0af3907bd5427
    with:
      operation: ${{ inputs.operation || '' }}

name: CI Start Workflow

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-source
  cancel-in-progress: false

jobs:
  select-provider:
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      provider: ${{ steps.select.outputs.provider }}
      context: ${{ steps.select.outputs.context }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select credential provider
        id: select
        env:
          CI_PROFILE: source-ci
        run: node dependencies/packages/core/dependencyLoader/index.ts --exec luau.lute run ci/entry.luau --credential-provider

  gate:
    needs: select-provider
    if: needs.select-provider.outputs.provider == 'github-context'
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      - name: Start bootstrap
        env:
          CI_PROFILE: source-ci
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CI_SECRETS: ${{ needs.select-provider.outputs.context == 'true' && toJSON(secrets) || '{}' }}
          CI_VARIABLES: ${{ needs.select-provider.outputs.context == 'true' && toJSON(vars) || '{}' }}
        run: build/dependencies/bin/lute/lute run ci/entry.luau
      # Artifacts are diagnostic output; no publication operation occurs in this job.
      - name: Collect bootstrap output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-start
          path: |
            build/run/ci-start/logs/
            build/run/ci-start/responses/
            build/run/ci-start/artifacts/workflow.yml
            build/run/ci-execution/
          if-no-files-found: ignore

  gate-oidc:
    needs: select-provider
    if: needs.select-provider.outputs.provider == 'oidc'
    name: gate (OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      - name: Start bootstrap
        env:
          CI_PROFILE: source-ci
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: build/dependencies/bin/lute/lute run ci/entry.luau
      # Artifacts are diagnostic output; no publication operation occurs in this job.
      - name: Collect bootstrap output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-start
          path: |
            build/run/ci-start/logs/
            build/run/ci-start/responses/
            build/run/ci-start/artifacts/workflow.yml
            build/run/ci-execution/
          if-no-files-found: ignore

name: CI Start Workflow

on:
  push:
    branches: [source]

permissions:
  contents: read

jobs:
  bootstrap:
    name: Starting bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start bootstrap
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          CI_GITHUB_VARIABLES: ${{ toJSON(vars) }}
        run: bash repo/ci/dependencies/lune/bootstrap.sh run repo/ci/entry.luau

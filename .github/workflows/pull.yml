name: Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}
jobs:
  dispatch:
    name: Request CI
    if: github.event.pull_request.base.ref == github.event.repository.default_branch && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Submit immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OPERATION: review
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_REF: refs/heads/${{ github.event.pull_request.head.ref }}
          REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${REQUEST_INPUTS:-}" ]]; then REQUEST_INPUTS='{}'; fi
          jq -n --arg event 'pull_request' --arg operation "$CI_OPERATION" --arg ref "$REQUEST_REF" --arg sha "$REQUEST_SHA" --argjson publish "${REQUEST_PUBLISH:-false}" --argjson pr "${PR_NUMBER:-0}" --argjson inputs "$REQUEST_INPUTS" '{event_type:"ci-request",client_payload:{event:$event,operation:$operation,ref:$ref,sha:$sha,publish:$publish,pr:$pr,inputs:$inputs}}' | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

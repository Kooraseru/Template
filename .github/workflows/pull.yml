name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: read
    with:
      operation: review

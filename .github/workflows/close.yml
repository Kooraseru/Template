name: Close Pull Request

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      operation: preview-retire
      component_variables: >-
        ${{ format('{{"cloudflare_account_id":{0}}}', toJSON(vars.CLOUDFLARE_ACCOUNT_ID)) }}
    secrets:
      component_credentials: >-
        ${{ format('{{"cloudflare_api_token":{0}}}', toJSON(secrets.CLOUDFLARE_API_TOKEN)) }}

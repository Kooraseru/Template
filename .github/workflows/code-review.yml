name: Code Review

on:
  pull_request:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl -fLSs --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Install checker dependencies
        run: node dependencies/packages/core/dependencyLoader/index.ts
      - name: Review source and repository rules
        run: node ci/code-review.cjs
      - name: Preserve full diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-review-findings
          path: build/code-review/
          if-no-files-found: warn
          retention-days: 7

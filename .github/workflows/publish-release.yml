name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version key from content/releases/releases.toml
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish configured GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Lune
        run: bash ci/toolchain/lune.sh --install
      - name: Stage configured release records
        run: bash ci/toolchain/lune.sh run ci/bootstrap/invoke.luau ci/components/releases/init.luau workflow_dispatch
      - name: Publish release with GitHub generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          entry="$(jq -ce --arg version "$RELEASE_VERSION" '.releases[] | select(.version == $version)' build/repo/releases/index.json)" || {
            printf 'No configured release record for version %s\n' "$RELEASE_VERSION" >&2
            exit 1
          }

          tag="$(jq -r '.tag' <<<"$entry")"
          target="$(jq -r '.commit' <<<"$entry")"
          previous_tag="$(jq -r '.previousTag // empty' <<<"$entry")"
          prerelease="$(jq -r '.prerelease' <<<"$entry")"
          notes="$(jq -r '.notes // empty' <<<"$entry")"
          args=(--title "$tag" --target "$target" --generate-notes)
          if [[ -n "$previous_tag" ]]; then
            # gh maps --notes-start-tag to GitHub's previous_tag_name input.
            args+=(--notes-start-tag "$previous_tag")
          fi
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ -n "$notes" ]]; then
            args+=(--notes-file "build/repo/releases/$notes")
          fi
          gh release create "$tag" "${args[@]}"

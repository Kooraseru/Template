    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && (github.event.client_payload.publish == true) && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_credential == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_credential || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: credential
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: Kooraseru-Hub/CI-Engine@dc1d3e10e22c2325b447bee672e07f2f498f380b
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BIND_SECRET_CI_APP_PRIVATE_KEY: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.secret_names, 'CI_APP_PRIVATE_KEY') && secrets.CI_APP_PRIVATE_KEY || '' }}
          CI_BIND_SECRET_CI_TOKEN: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-projects') && contains(matrix.secret_names, 'CI_TOKEN') && secrets.CI_TOKEN || '' }}
          CI_BIND_SECRET_CLOUDFLARE_API_TOKEN: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.secret_names, 'CLOUDFLARE_API_TOKEN') && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CI_BIND_VARIABLE_CI_APP_ID: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.variable_names, 'CI_APP_ID') && vars.CI_APP_ID || '' }}
          CI_BIND_VARIABLE_CLOUDFLARE_ACCOUNT_ID: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.variable_names, 'CLOUDFLARE_ACCOUNT_ID') && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
        with:
          phase: delivery-run
          operation: ${{ github.event.client_payload.operation }}
          publish: ${{ (github.event.client_payload.publish == true) }}

  publish_pages:
    name: Publish (pages - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.resolve.outputs.trusted == 'true' && needs.authorize.result == 'success' && needs.authorize.outputs.mode == 'staged' && (github.event.client_payload.publish == true) && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_pages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_pages || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-site-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_DELIVERY_LANE: pages
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: Kooraseru-Hub/CI-Engine@dc1d3e10e22c2325b447bee672e07f2f498f380b
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BIND_SECRET_CI_APP_PRIVATE_KEY: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.secret_names, 'CI_APP_PRIVATE_KEY') && secrets.CI_APP_PRIVATE_KEY || '' }}
          CI_BIND_SECRET_CI_TOKEN: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-projects') && contains(matrix.secret_names, 'CI_TOKEN') && secrets.CI_TOKEN || '' }}
          CI_BIND_SECRET_CLOUDFLARE_API_TOKEN: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.secret_names, 'CLOUDFLARE_API_TOKEN') && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CI_BIND_VARIABLE_CI_APP_ID: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.variable_names, 'CI_APP_ID') && vars.CI_APP_ID || '' }}
          CI_BIND_VARIABLE_CLOUDFLARE_ACCOUNT_ID: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.variable_names, 'CLOUDFLARE_ACCOUNT_ID') && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
        with:
          phase: delivery-run
          operation: ${{ github.event.client_payload.operation }}
          publish: ${{ (github.event.client_payload.publish == true) }}
      - name: Resolve deployment artifact
        id: options
        uses: Kooraseru-Hub/CI-Engine@dc1d3e10e22c2325b447bee672e07f2f498f380b
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          phase: delivery-options
          operation: ${{ github.event.client_payload.operation }}
          publish: ${{ (github.event.client_payload.publish == true) }}
      - name: Upload Pages artifact
        id: pages_artifact
        if: ${{ steps.options.outputs.delivery_enabled == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ matrix.pages_path }}
      - name: Await Pages artifact visibility
        if: ${{ steps.options.outputs.delivery_enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::The Pages upload did not return a valid artifact ID'
            exit 1
          fi
          for delay in 0 2 4 8 12 18; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if visible="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"github-pages\" and .id == ${PAGES_ARTIFACT_ID} and .expired == false) | .id")"; then
              if [[ "$visible" == "$PAGES_ARTIFACT_ID" ]]; then
                echo "Pages artifact $PAGES_ARTIFACT_ID is visible to the Actions API"
                # The deploy-pages action uses a different artifact-listing client.
                sleep 5
                exit 0
              fi
            fi
            echo "::notice::Waiting for Pages artifact $PAGES_ARTIFACT_ID to become visible"
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_ID was not visible before the retry limit"
          exit 1
      - name: Deploy Pages
        id: deployment
        if: ${{ steps.options.outputs.delivery_enabled == 'true' }}
        uses: actions/deploy-pages@v5

  publish_external:
    name: Publish (external - ${{ matrix.id }})
    needs: [resolve, plan, authorize, execute, test]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && ((needs.resolve.outputs.trusted == 'true' && needs.authorize.outputs.mode == 'staged' && (github.event.client_payload.publish == true)) || (needs.resolve.outputs.review_pr != '' && needs.resolve.outputs.event == 'pull_request' && needs.authorize.outputs.mode == 'readonly' && !(github.event.client_payload.publish == true))) && needs.execute.result == 'success' && (needs.plan.outputs.host_tests != 'true' || needs.test.result == 'success') && needs.plan.outputs.delivery_has_external == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.delivery_external || '{"include":[]}') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: write
    environment:
      name: ${{ matrix.environment }}
      deployment: false
    env:
      CI_ORIGIN_EVENT: ${{ needs.resolve.outputs.event }}
      CI_ORIGIN_REF: ${{ needs.resolve.outputs.ref }}
      CI_ORIGIN_SHA: ${{ needs.resolve.outputs.sha }}
      CI_ORIGIN_ACTION: ${{ needs.resolve.outputs.action }}
      CI_ORIGIN_INPUTS: ${{ needs.resolve.outputs.inputs }}
      CI_ORIGIN_TRUSTED: ${{ needs.resolve.outputs.trusted }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_REVIEW_PR: ${{ needs.resolve.outputs.review_pr }}
      CI_DELIVERY_LANE: external
      CI_DELIVERY_ENTRY: ${{ toJSON(matrix) }}
    steps:
      - name: Checkout immutable trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.event == 'pull_request' && github.sha || needs.resolve.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Receive same-run delivery inputs
        if: ${{ needs.plan.outputs.delivery_destination != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-delivery-input
          path: ${{ needs.plan.outputs.delivery_destination }}
      - name: Execute authorized publisher
        uses: Kooraseru-Hub/CI-Engine@dc1d3e10e22c2325b447bee672e07f2f498f380b
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BIND_SECRET_CI_APP_PRIVATE_KEY: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.secret_names, 'CI_APP_PRIVATE_KEY') && secrets.CI_APP_PRIVATE_KEY || '' }}
          CI_BIND_SECRET_CI_TOKEN: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-projects') && contains(matrix.secret_names, 'CI_TOKEN') && secrets.CI_TOKEN || '' }}
          CI_BIND_SECRET_CLOUDFLARE_API_TOKEN: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.secret_names, 'CLOUDFLARE_API_TOKEN') && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CI_BIND_VARIABLE_CI_APP_ID: ${{ (matrix.environment == 'ci-bootstrap' || matrix.environment == 'ci-reporting' || matrix.environment == 'ci-rulesets') && contains(matrix.variable_names, 'CI_APP_ID') && vars.CI_APP_ID || '' }}
          CI_BIND_VARIABLE_CLOUDFLARE_ACCOUNT_ID: ${{ (matrix.environment == 'ci-preview-cloudflare') && contains(matrix.variable_names, 'CLOUDFLARE_ACCOUNT_ID') && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
        with:
          phase: delivery-run
          operation: ${{ github.event.client_payload.operation }}
          publish: ${{ (github.event.client_payload.publish == true) }}

  report:
    name: Collect
    needs: [execute, plan, test, publish_contents, publish_issues, publish_credential, publish_pages, publish_external]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarize execution
        env:
          EXECUTION_RESULT: ${{ needs.execute.result }}
          HOST_TESTS: ${{ needs.plan.outputs.host_tests }}
          HOST_RESULT: ${{ needs.test.result }}
          CONTENTS_REQUIRED: ${{ needs.plan.outputs.delivery_has_contents }}
          CONTENTS_RESULT: ${{ needs.publish_contents.result }}
          ISSUES_REQUIRED: ${{ needs.plan.outputs.delivery_has_issues }}
          ISSUES_RESULT: ${{ needs.publish_issues.result }}
          CREDENTIAL_REQUIRED: ${{ needs.plan.outputs.delivery_has_credential }}
          CREDENTIAL_RESULT: ${{ needs.publish_credential.result }}
          PAGES_REQUIRED: ${{ needs.plan.outputs.delivery_has_pages }}
          PAGES_RESULT: ${{ needs.publish_pages.result }}
          EXTERNAL_REQUIRED: ${{ needs.plan.outputs.delivery_has_external }}
          EXTERNAL_RESULT: ${{ needs.publish_external.result }}
        run: |
          set -euo pipefail
          {
            echo "### CI Engine execution"
            echo ""
            echo "Execution result: **$EXECUTION_RESULT**"
            echo ""
            echo "Project diagnostics and delivery inputs are attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$EXECUTION_RESULT" = success
          if [[ "$HOST_TESTS" == true ]]; then test "$HOST_RESULT" = success; fi
          if [[ "$CONTENTS_REQUIRED" == true ]]; then test "$CONTENTS_RESULT" = success; fi
          if [[ "$ISSUES_REQUIRED" == true ]]; then test "$ISSUES_RESULT" = success; fi
          if [[ "$CREDENTIAL_REQUIRED" == true ]]; then test "$CREDENTIAL_RESULT" = success; fi
          if [[ "$PAGES_REQUIRED" == true ]]; then test "$PAGES_RESULT" = success; fi
          if [[ "$EXTERNAL_REQUIRED" == true ]]; then test "$EXTERNAL_RESULT" = success; fi

  cleanup:
    name: Cleanup
    needs: report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Finalize engine lifecycle
        env:
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          set -euo pipefail
          echo "CI Engine: runner workspaces are ephemeral."
          echo "CI Engine: no temporary execution branches were created."
          test "$REPORT_RESULT" = success

  validate:
    name: validate
    needs: [resolve, cleanup]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report independent execution to PR
        if: ${{ needs.resolve.outputs.check != '' }}
        uses: Kooraseru-Hub/CI-Engine@dc1d3e10e22c2325b447bee672e07f2f498f380b
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: ${{ needs.resolve.outputs.check }}
          CI_CHECK_RESULT: ${{ needs.cleanup.result }}
        with:
          phase: status
          operation: ${{ github.event.client_payload.operation }}
      - name: Require completed pipeline
        env:
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |
          set -euo pipefail
          test "$CLEANUP_RESULT" = success

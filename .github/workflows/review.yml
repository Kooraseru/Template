name: PR Results
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions: {}
jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/components/quality/code-review/resolve.cjs open
  review:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: review-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          REQUEST_SHA: ${{ needs.resolve.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/components/quality/code-review/publish.cjs
  preview:
    needs: resolve
    if: needs.resolve.outputs.pr != '' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ci-preview-cloudflare
      deployment: false
    concurrency:
      group: ci-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Kooraseru-Hub/CI-Packages/packages/documentation/preview@1339cccda7451615ea5309a55995611068b9364f
        id: preview-settings
        with:
          mode: build-settings
          config: config/targets.toml
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.preview-settings.outputs.enabled == 'true'
        with:
          name: documentation-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build/preview-candidate
      - uses: Kooraseru-Hub/CI-Packages/packages/documentation/preview@1339cccda7451615ea5309a55995611068b9364f
        if: steps.preview-settings.outputs.enabled == 'true'
        with:
          mode: native
          config: config/targets.toml
          directory: build/preview-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          REQUEST_SHA: ${{ needs.resolve.outputs.sha }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

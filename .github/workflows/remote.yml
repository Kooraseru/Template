name: Remote

on:
  repository_dispatch:
    types: [ci-validation]

permissions: {}
jobs:
  dispatch:
    name: Request CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Submit immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OPERATION: remote-validation
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REQUEST_REF="$GITHUB_REF"
          REQUEST_SHA="$GITHUB_SHA"
          if [[ -z "${REQUEST_INPUTS:-}" ]]; then REQUEST_INPUTS='{}'; fi
          jq -n --arg event 'repository_dispatch' --arg operation "$CI_OPERATION" --arg ref "$REQUEST_REF" --arg sha "$REQUEST_SHA" --argjson publish "${REQUEST_PUBLISH:-false}" --argjson pr "${PR_NUMBER:-0}" --argjson inputs "$REQUEST_INPUTS" '{event_type:"ci-request",client_payload:{event:$event,operation:$operation,ref:$ref,sha:$sha,publish:$publish,pr:$pr,inputs:$inputs}}' | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

name: Retire Preview

on:
  workflow_run:
    workflows: ["Close Pull Request"]
    types: [completed]

permissions: {}
jobs:
  resolve:
    name: Resolve PR
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve verified PR identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.github/components/quality/code-review/resolve.cjs" -f ref="$GITHUB_SHA" --jq .content | base64 -d > "$RUNNER_TEMP/ci-pr-resolve.cjs"
          node "$RUNNER_TEMP/ci-pr-resolve.cjs" closed

  retire:
    name: Retire preview
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    concurrency:
      group: ci-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ci-preview-cloudflare
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Retire existing preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          REQUEST_SHA: ${{ needs.resolve.outputs.sha }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/components/documentation/pages/publish/preview/publish.cjs --retire

name: Manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select an available CI operation
        type: choice
        required: true
        default: validation
        options:
          - build
          - preview
          - publish
          - publish-check
          - readiness
          - rules-audit
          - validation
      publish:
        description: Confirm publication for publish or preview
        type: boolean
        required: false
        default: false
      preview_kind:
        description: Preview action (used with operation preview)
        type: choice
        required: false
        default: pr
        options:
          - pr
          - branch
          - delete-pr
          - delete-branch
      preview_pr:
        description: PR number for pr or delete-pr (0 when unused)
        type: number
        required: false
        default: 0
      preview_branch:
        description: Existing branch name for branch or delete-branch
        type: string
        required: false
        default: ""


permissions: {}
jobs:
  dispatch:
    name: Request CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Submit immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OPERATION: ${{ inputs.operation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
          REQUEST_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          REQUEST_REF="$GITHUB_REF"
          REQUEST_SHA="$GITHUB_SHA"
          jq -n --arg event 'workflow_dispatch' --arg operation "$CI_OPERATION" --arg ref "$REQUEST_REF" --arg sha "$REQUEST_SHA" --argjson publish "${REQUEST_PUBLISH:-false}" --argjson pr "${PR_NUMBER:-0}" --argjson inputs "${REQUEST_INPUTS:-\{\}}" '{event_type:"ci-request",client_payload:{event:$event,operation:$operation,ref:$ref,sha:$sha,publish:$publish,pr:$pr,inputs:$inputs}}' | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

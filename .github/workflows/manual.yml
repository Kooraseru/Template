name: Manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select an available CI operation
        type: choice
        required: true
        default: validation
        options:
          - build
          - preview
          - publish
          - publish-check
          - readiness
          - rules-audit
          - validation
      publish:
        description: Confirm publication for publish or preview
        type: boolean
        required: false
        default: false
      preview_kind:
        description: Preview action (used with operation preview)
        type: choice
        required: false
        default: pr
        options:
          - pr
          - branch
          - delete-pr
          - delete-branch
      preview_pr:
        description: PR number for pr or delete-pr (0 when unused)
        type: number
        required: false
        default: 0
      preview_branch:
        description: Existing branch name for branch or delete-branch
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ci-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: read
      actions: read
    with:
      operation: ${{ inputs.operation }}
      publish: ${{ inputs.publish }}
    secrets:
      app_private_key: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON('["validation","build","publish","preview"]'), inputs.operation) && secrets.CI_APP_PRIVATE_KEY || '' }}
      bootstrap_token: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(fromJSON('["validation","build","publish","preview"]'), inputs.operation) && secrets.CI_TOKEN || '' }}

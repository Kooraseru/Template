name: Push

on:
  push:
    branches:
      - '**'
      - '!ci/**'
      - '!run/**'

permissions: {}

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: read
      actions: read
    with:
      operation: validation
    secrets:
      app_private_key: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.CI_APP_PRIVATE_KEY || '' }}
      bootstrap_token: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.CI_TOKEN || '' }}

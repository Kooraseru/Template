name: Push

on:
  push:
    branches:
      - '**'
      - '!ci/**'
      - '!run/**'

permissions: {}

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Engine Push
    uses: ./.github/workflows/bootstrap.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      operation: validation
    secrets:
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      bootstrap_token: ${{ secrets.CI_TOKEN }}

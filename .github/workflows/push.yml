name: Push

on:
  push:
    branches:
      - '**'
      - '!ci/**'
      - '!run/**'

permissions: {}
jobs:
  dispatch:
    name: Request CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Submit immutable request
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OPERATION: validation
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REQUEST_REF="$GITHUB_REF"
          REQUEST_SHA="$GITHUB_SHA"
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            branch="${GITHUB_REF#refs/heads/}"
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="${GITHUB_REPOSITORY%%/*}:$branch" -f base="$DEFAULT_BRANCH" --jq 'length')
            if [[ "$count" != 0 ]]; then echo "PR review owns this branch revision"; exit 0; fi
          fi
          jq -n --arg event 'push' --arg operation "$CI_OPERATION" --arg ref "$REQUEST_REF" --arg sha "$REQUEST_SHA" --argjson publish "${REQUEST_PUBLISH:-false}" --argjson pr "${PR_NUMBER:-0}" --argjson inputs "${REQUEST_INPUTS:-\{\}}" '{event_type:"ci-request",client_payload:{event:$event,operation:$operation,ref:$ref,sha:$sha,publish:$publish,pr:$pr,inputs:$inputs}}' | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

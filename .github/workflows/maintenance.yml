name: Maintenance
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Repository maintenance (rehearse never writes)
        options: [rehearse, labels, milestones]
        default: rehearse
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node dependencies/packages/core/dependencyLoader/index.ts --only luau.lute --exec luau.lute --version
      - run: dependencies/managed/bin/lute/lute run .github/components/work/maintenance.luau
  apply:
    needs: validate
    if: github.ref_name == github.event.repository.default_branch && inputs.target != 'rehearse'
    runs-on: ubuntu-latest
    environment: ci-publication
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node dependencies/packages/core/dependencyLoader/index.ts --only luau.lute --exec luau.lute --version
      - env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_TARGET: ${{ inputs.target }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: dependencies/managed/bin/lute/lute run .github/components/work/maintenance.luau

# Aliases resolve to semantic GitHub styles and matching solid status badge colors.
# Native alerts can use status_alert in top-level templates. The centered
# summary uses badges because alerts cannot be nested inside other elements.
[colors]
success = "github.tip"
failure = "github.caution"
warning = "github.warning"
neutral = "github.note"
info = "github.note"
pending = "github.important"

# Resolved status styles select one solid palette color.
[status_colors]
"github.note" = "neutral"
"github.tip" = "success"
"github.important" = "pending"
"github.warning" = "warning"
"github.caution" = "failure"

# Solid colors shared by every badge and navigation button.
[palette]
success = "6DBE93"
failure = "D95D66"
warning = "C98B36"
neutral = "64748B"
info = "5385B1"
pending = "8B75B5"

# Individual CI header badge colors; runner, result, and artifact SVGs render separately.
[header]
runner_ubuntu = "C65335"
runner_windows = "0078D4"
runner_macos = "62666B"
runner_other = "6F42C1"
status_background = "24292F"
artifacts_background = "A36F21"
success_dot = "3FB950"
failure_dot = "F85149"
pending_dot = "D29922"
neutral_dot = "8B949E"

# Shared default size and foreground color apply to all status and navigation badges.
[badges]
size = "default"
variant = "branded"
iconless_variant = "branded"
logo_color = "FFFFFF"
text_color = "FFFFFF"

[buttons.run]
label = "Open this run"
target = "run_url"
logo = "github"
color = "info"

[buttons.execution]
label = "Open CI Execution"
target = "execution_url"
logo = "githubactions"
color = "pending"

[buttons.artifacts]
label = "Open this run and its artifacts"
target = "run_url"
logo = "githubactions"
color = "pending"

[buttons.repository]
label = "Repository"
target = "repository_url"
logo = "github"
color = "info"

# Every node can have more children. Its Markdown receives {{children}}.
# if_value hides a node when the named runtime value is empty.
[responses.start]
markdown = "start/root.md"

[responses.start.children.overview]
markdown = "start/overview/root.md"
order = 10

[responses.start.children.attention]
markdown = "shared/attention.md"
if_value = "attention"
order = 5

[responses.start.children.components]
markdown = "shared/components/root.md"
if_value = "component_tree"
order = 30

[responses.execution]
markdown = "execution/root.md"

[responses.execution.children.overview]
markdown = "execution/overview/root.md"
order = 10

[responses.execution.children.components]
markdown = "shared/components/root.md"
if_value = "component_tree"
order = 20

[responses.execution.children.attention]
markdown = "shared/attention.md"
if_value = "attention"
order = 5

[outcome_guidance]
failure = "Open the component job and inspect its first failing step before retrying."
blocked = "Check the job dependencies and run conditions. Resolve any unsuccessful prerequisites, then rerun CI."
abandoned = "GitHub marked this job abandoned. Check the job and run annotations for a GitHub policy or review notice before retrying. The job did not establish a missing credential permission."
cancelled = "Check why the job was cancelled and rerun if needed."
timed_out = "Inspect the last running step before retrying; adjust the timeout only if the work needs more time."

[templates]
"outcome" = "shared/outcome.md"
"authorization.unavailable" = "shared/authorization/unavailable.md"
"components.group" = "shared/components/group/root.md"
"components.component" = "shared/components/component/root.md"
"records.record" = "shared/records/record/root.md"
"execution.error" = "shared/error.md"
"execution.response-transfer" = "shared/response-transfer.md"
"attestations.result" = "shared/attestation-summary.md"
"authorization.check-runs" = "shared/authorization/check-runs.md"
"authorization.token" = "shared/authorization/token-permissions.md"
"token.evidence" = "shared/authorization/token/evidence.md"
"token.verified" = "shared/authorization/token/verified.md"
"token.insufficient" = "shared/authorization/token/insufficient.md"
"token.invalid" = "shared/authorization/token/invalid.md"
"token.unverified" = "shared/authorization/token/unverified.md"
"token.rejected" = "shared/authorization/token/rejected.md"
"setup.app" = "shared/authorization/app-setup.md"
"setup.app-update" = "shared/authorization/app-update.md"
"setup.app-connect" = "shared/authorization/app-connect.md"
"setup.app-restore" = "shared/authorization/app-restore.md"
"setup.app-state-configured" = "shared/authorization/app-state-configured.md"
"setup.app-state-partial" = "shared/authorization/app-state-partial.md"
"setup.app-state-unavailable" = "shared/authorization/app-state-unavailable.md"
"setup.app-registration" = "shared/authorization/app-registration.md"
"setup.app-account" = "shared/authorization/app-account.md"
"setup.app-account-personal" = "shared/authorization/app-account-personal.md"
"setup.app-account-organization" = "shared/authorization/app-account-organization.md"

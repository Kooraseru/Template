# GitHub decisions belong here. Repository paths are owner/repository.
[github]
# "current" automatically resolves to the repository running CI.
repository = "current"

[github.aliases]
# Fill in the names used by your project. There are no implicit aliases.
# Want to send something to your public repository? Fill in its GitHub path:
# public_repo = "your-account/your-public-repository"
# Consumers can look up public_repo instead of repeating that path in code.
# shared_tools = "example-org/shared-tools"
# organization = "example-org"

[github.bootstrap]
enabled = true
branch_prefix = "ci/run-"

[github.publication]
# Omitted switches default to enabled on eligible pushes.
releases = false
packages = false
branches = true
pages = true # Pages deployments run only after a successful trusted source CI push.
milestones = false

# Preview publication uses an explicit, trusted source-branch dispatch.
# Pull request and branch builds run with read-only GitHub permissions.
[github.previews]
enabled = true
provider = "github-pages" # "github-pages" or "cloudflare-pages"
pull_requests = true
branches = true
path_prefix = "previews"
state_branch = "pages-state"
retention_days = 14
# Cloudflare Direct Upload project name, required when provider = "cloudflare-pages".
cloudflare_project = ""

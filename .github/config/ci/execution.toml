# A component skips when it has no work to perform.
# This policy selects the result reported for that skipped component.
# The default applies to every component without an override.
# A component-specific entry overrides the default.
# success: accept the skip and continue successfully.
# neutral: report the skip as neutral.
# failure: fail CI because the component skipped.
[skip]
default = "neutral"

[skip.components]
# The sample packages are staging fixtures with no registry metadata.
"distribution/packages/publish" = "success"
# These native integrations are not yet wired into fixed-stage CI; skipped is expected.
"documentation/pages/publish" = "success"
"distribution/attestations/publish" = "success"
# Missing optional account/repository administration credentials are accepted skips.
# Runtime errors after authorization still fail the component.
"work/projects/sync" = "success"
"governance/rulesets/sync" = "success"

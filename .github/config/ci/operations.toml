# Operation routing and temporary compatibility checks. Component discovery and execution
# policy are configured independently in components.toml and execution.toml.
version = 1

[triggers]
push = "publish"
pull_request = "review"
workflow_dispatch = "validation"

[bootstrap]
environment = "ci-bootstrap"

[operations.review]
mode = "readonly"
components = ["quality/code-review", "quality/rules-audit", "quality/test-suites"]
events = ["pull_request"]
checks = ["setup", "workflows", "code-review", "rules-audit", "build-tests"]

[operations.validation]
mode = "readonly"
components = ["quality/code-review", "quality/rules-audit", "quality/test-suites"]
events = ["workflow_dispatch"]
checks = ["setup", "workflows", "code-review", "rules-audit", "build-tests"]

[operations.readiness]
mode = "readonly"
components = ["quality/code-review", "quality/rules-audit"]
events = ["workflow_dispatch"]
checks = ["setup", "workflows", "code-review", "rules-audit"]

[operations.build]
mode = "generated"
events = ["workflow_dispatch"]
plan = "build"
publication = false
branchPrefix = "run/build-"

[operations.publish]
mode = "generated"
events = ["push", "workflow_dispatch"]
plan = "build"
publication = true
branchPrefix = "ci/run-"

[operations.rules-audit]
mode = "readonly"
components = ["quality/rules-audit"]
events = ["workflow_dispatch"]
checks = ["rules-audit"]

# Compatibility-only definitions for the current CJS read-only runner.
# These disappear when Run Pipeline executes the generated workflow itself.
[checks.setup]
command = ["node", "dependencies/packages/core/dependencyLoader/index.ts"]
timeoutSeconds = 300

[checks.workflows]
command = ["bash", "ci/bootstrap/check-workflows.sh"]
timeoutSeconds = 90

[checks.code-review]
command = ["node", "ci/code-review.cjs"]
timeoutSeconds = 750

[checks.rules-audit]
command = ["node", "ci/rules-audit.cjs"]
group = "audit"
timeoutSeconds = 750

[checks.build-tests]
command = ["bash", "ci/run.sh"]
timeoutSeconds = 1200


name: Set up Rust
description: Install the consuming project's explicitly selected Rust toolchain.
inputs:
  toolchain:
    description: Rust toolchain version.
    required: true
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt,clippy

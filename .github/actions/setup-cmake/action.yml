name: Set up CMake
description: Install an explicitly selected CMake version.
inputs:
  version:
    description: CMake major.minor.patch version.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - shell: bash
      env:
        CMAKE_VERSION: ${{ inputs.version }}
      run: python -m pip install "cmake==$CMAKE_VERSION"

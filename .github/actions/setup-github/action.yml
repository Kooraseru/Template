name: Set up GitHub CLI
description: Ensure gh is available inside the actual workflow runner.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if ! command -v gh >/dev/null 2>&1; then
          if [ "$(uname -s)" != Linux ] || ! command -v apt-get >/dev/null 2>&1; then
            echo "GitHub CLI must be installed on this runner" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes gh
        fi
        gh --version

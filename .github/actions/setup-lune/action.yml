name: Set up Lune
description: Install checksum-verified Lune 0.10.5.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x86_64; checksum=1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791 ;;
          Linux/ARM64) platform=linux-aarch64; checksum=176e1272d41ba3d9ea30087b528048a4a97e3d74cfa0eaa5d35d9e0d4122caa6 ;;
          macOS/X64) platform=macos-x86_64; checksum=f4b43cfd495994b7ef783ac2bb0aa24f1f940f3804b28018121bb3cc2171c1a7 ;;
          macOS/ARM64) platform=macos-aarch64; checksum=bdb94f47bc1d3af3e3fe796cfce9c7f406042d4aada9cc41a1c53836f3e3b411 ;;
          Windows/X64) platform=windows-x86_64; checksum=ad0305f5cc6d7ff20996644b40bf7de0de613812f431ca241456e16f9fc89cda ;;
          Windows/ARM64) platform=windows-aarch64; checksum=b98bc49ded9183951c1d01b428872cd8ce518f200b48824ea3b31e3d7dec28ae ;;
          *) echo "Unsupported Lune runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        destination="$RUNNER_TEMP/lune"
        if [[ "$RUNNER_OS" == Windows ]]; then destination="$(cygpath -u "$destination")"; fi
        mkdir -p "$destination"
        curl --fail --location --retry 3 "https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-$platform.zip" --output "$destination/lune.zip"
        if command -v sha256sum >/dev/null; then
          echo "$checksum  $destination/lune.zip" | sha256sum --check
        else
          echo "$checksum  $destination/lune.zip" | shasum -a 256 --check
        fi
        unzip -o "$destination/lune.zip" -d "$destination"
        if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$destination/lune"; fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          cygpath -w "$destination" >> "$GITHUB_PATH"
        else
          echo "$destination" >> "$GITHUB_PATH"
        fi

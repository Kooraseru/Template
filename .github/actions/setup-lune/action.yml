name: Set up Lune
description: Install checksum-verified Lune 0.11.1 for Luau CI components.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then
          case "$(uname -m)" in
            x86_64) RUNNER_ARCH=X64 ;;
            aarch64|arm64) RUNNER_ARCH=ARM64 ;;
            *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
          esac
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x86_64; checksum=39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1 ;;
          Linux/ARM64) platform=linux-aarch64; checksum=f8d7d63384fad5edfaf5423b0ff1a1dbca9c44ec43beaa35c234b20a584aea66 ;;
          macOS/X64) platform=macos-x86_64; checksum=d083047e08a40bd73dbb1ae8af929536497c0d57021c0ead0f9c8571f228a5fa ;;
          macOS/ARM64) platform=macos-aarch64; checksum=0592c9b37c06f208f7d90e5d750e76101b9ba6191cd693ef34667f4f1f1063d4 ;;
          Windows/X64) platform=windows-x86_64; checksum=83f1dc29d9e35c494907521f2ca6561f6c204fdf6f1b06525d2e9fdd1e6b4301 ;;
          Windows/ARM64) platform=windows-aarch64; checksum=1b1394ca2ba4990ecde440cf787ff46f9c52b2c4318a39fa3373fc56b71e7d8a ;;
          *) echo "Unsupported Lune runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        destination="$RUNNER_TEMP/lune"
        if [[ "$RUNNER_OS" == Windows ]]; then destination="$(cygpath -u "$destination")"; fi
        mkdir -p "$destination"
        curl --fail --location --retry 3 "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-$platform.zip" --output "$destination/lune.zip"
        if [[ "$RUNNER_OS" != macOS ]] && command -v sha256sum >/dev/null; then
          echo "$checksum  $destination/lune.zip" | sha256sum -c
        else
          echo "$checksum  $destination/lune.zip" | shasum -a 256 -c
        fi
        unzip -o "$destination/lune.zip" -d "$destination"
        if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$destination/lune"; fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          cygpath -w "$destination" >> "$GITHUB_PATH"
        else
          echo "$destination" >> "$GITHUB_PATH"
        fi

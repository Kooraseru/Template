phase = "build"
provides = ["releases.generated"]
requires = ["build.completed"]
inputs = [".github/config/publishing/releases/settings.json", ".github/config/publishing/releases/*/release.json", ".github/config/publishing/releases/*/notes.md"]
outputs = ["build/github/releases/**"]
events = ["push", "pull_request", "workflow_dispatch"]
boundary = "read"

# Release channels declare the commit range shown for releases.
[release]
source = "HEAD"
notes = "10.1.2026.md"

[release.channels.prerelease]
# This channel's first range begins just before the existing prerelease tag.
from = "0.1.0-pre.1^"

[release.channels.release]
# Later releases continue from the previous configured release commit.
from = "previous"

# Choose the version format independently from release channels and ranges.
[release.format]
type = "semver"

[release.formats.semver]
# Advanced settings: prerelease_identifier = "pre", allow_build_metadata = false
prerelease_identifier = "pre"
allow_build_metadata = false

[[release.formats.semver.entries]]
version = "0.2.0-pre.1"
channel = "prerelease"
source = "0.1.0-pre.1"

[[release.formats.semver.entries]]
version = "0.2.0"
channel = "release"

# Other formats can be selected by setting release.format.type and defining
# the corresponding [release.formats.<type>] table and entries.

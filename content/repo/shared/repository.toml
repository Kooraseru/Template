[sections.project.title.values]
en-US = "Project"
ja-JP = "プロジェクト"

[sections.project.introduction.values]
en-US = "Template is maintained as a reusable repository baseline. Projects created from it should replace template identity and retain only capabilities with a responsible maintainer and active consumer."
ja-JP = "Template は再利用可能なリポジトリ基盤として管理されています。このテンプレートから作成したプロジェクトでは、テンプレートの識別情報を置き換え、担当メンテナーと実際の利用者が存在する機能のみを残してください。"


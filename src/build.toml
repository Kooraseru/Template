# Application build configuration
# Dependencies belong in native manifests and lockfiles alongside source.
# Paths and commands are repository-relative. Publication authority lives outside src/.

# Container Images
# Optional compiler environments; enable when the project uses them.
[images]
enabled = false
names = [
    "alpine-gcc-x64",
    "alpine-gcc-arm64",
    "alpine-clang-x64",
    "alpine-clang-arm64",
    "alpine-rust-x64",
    "alpine-rust-arm64",

    "debian-gcc-x64",
    "debian-gcc-arm64",
    "debian-clang-x64",
    "debian-clang-arm64",
    "debian-rust-x64",
    "debian-rust-arm64",
    "debian-mingw-x64",
    "debian-mingw-arm64",

    "ubuntu-gcc-x64",
    "ubuntu-gcc-arm64",
    "ubuntu-clang-x64",
    "ubuntu-clang-arm64",

    "fedora-gcc-x64",
    "fedora-gcc-arm64",
    "fedora-clang-x64",
    "fedora-clang-arm64",

    "arch-gcc-x64",
    "arch-clang-x64",
]


# Builds
# Run target probes and project build commands, then package outputs.
[build]
runner = "ubuntu-latest"
# Compiler targets are opt-in; see fabricator/targets.json for all 32 profiles.

# Optional:
# targets = ["alpine-gcc-x64", "windows-msvc-x64", "macos-clang-arm64"]
# matrix = [{ name = "custom", runner = "ubuntu-latest" }]
# toolchains = ["rust", "cmake"]
# rust_version = "1.99.0"
# cmake_version = "4.2.0"
# commands = [["cmake", "--build", "build/cmake"]]
# package_paths = ["build/bin"]
# projects = ["application"] # Omit to build every declared source target; [] selects none.


# Project source targets are independent of compiler-environment profiles above.
# Omit targets when the template has no application to compile.
# [[targets]]
# id = "application"
# system = "cargo"
# path = "src/cargo"
#
# [[targets]]
# id = "native-library"
# system = "cmake"
# path = "src/cpp/native-library"

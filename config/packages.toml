# Package behavior selection. The files type stages configured build outputs.
[packages]
type = "files"

[packages.types.files]
# Advanced options can be added here, such as archive format or naming rules.

[[packages.types.files.entries]]
name = "windows-amd"
files = ["build/windows-amd.exe"]

[[packages.types.files.entries]]
name = "windows-arm64"
files = ["build/windows-arm64.exe"]

[[packages.types.files.entries]]
name = "windows-intel"
files = ["build/windows-intel.exe"]

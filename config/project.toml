# CI configuration
# See config/README.md for available options and defaults.
# Local act runs never publish artifacts, regardless of publish settings.
#
# Optional settings are omitted unless explicitly configured.
# Commented examples show how to override their defaults.


# Repository
# Generate and publish the repository tree from selected paths.
[repository]
enabled = true
publish = true
include = ["source", "rules"]


# Documentation
# Generate and deploy the documentation site.
[pages]
enabled = true
publish = true

# Optional:
# title = "Project documentation"


# Releases
# Generate replaceable Release and Pre-Release versions from ci/publication/releases/versions.toml.
# Each public version selects a full source SHA; an empty list publishes none.
[release]
enabled = true
publish = true


# Application build and environment selections live in source/build.toml.

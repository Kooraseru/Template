# Shared release behavior. Only the selected versioning type is evaluated.
[release]
type = "semver"
source = "HEAD"
from = "beginning"
notes = "10.1.2026.md"

# Type-specific release logic. SemVer supports stable versions and prereleases.
[release.types.semver]
# Advanced options: prerelease_identifier = "pre", allow_build_metadata = false
prerelease_identifier = "pre"
allow_build_metadata = false

[[release.types.semver.entries]]
version = "0.1.0"
channel = "release"

[[release.types.semver.entries]]
version = "0.2.0-pre.1"
channel = "prerelease"

# Other supported versioning types can be selected by changing release.type.
# Keep each type's advanced settings and entries in its own section.
#
# [release.types.calver]
# format = "YYYY.MM"
# [[release.types.calver.entries]]
# version = "2026.10"
# channel = "release"
#
# [release.types.sequential]
# prefix = ""
# [[release.types.sequential.entries]]
# version = "42"
# channel = "release"
#
# [release.types.major_minor]
# [[release.types.major_minor.entries]]
# version = "3.7"
# channel = "release"
#
# [release.types.marketing]
# [[release.types.marketing.entries]]
# version = "Windows 11"
# channel = "release"
#
# [release.types.git]
# [[release.types.git.entries]]
# version = "main-a3f91bc"
# channel = "prerelease"
#
# [release.types.date_build]
# [[release.types.date_build.entries]]
# version = "2026.10.28.1"
# channel = "release"
#
# [release.types.compatibility]
# [[release.types.compatibility.entries]]
# version = "v2-api3"
# channel = "release"
#
# [release.types.release_train]
# cadence = "quarterly"
# [[release.types.release_train.entries]]
# version = "2026.Q4"
# channel = "release"
#
# [release.types.epoch]
# [[release.types.epoch.entries]]
# version = "2:1.4.0"
# channel = "release"
